    ref: P.index, refLabel: 'Portfolio ' + pct(P.index) + '%',
    aria: 'Readiness by domain, weakest first: ' + rw.map(function (it) { return it.d.short + ' ' + pct(it.v) + '%'; }).join(', ') + '. Portfolio ' + pct(P.index) + '%.'
  });
  host.innerHTML = kpis +
    '<section class="exhibit" aria-labelledby="ex1">' +
      '<div class="ex-head"><p class="ex-label">Exhibit 1 · Maturity heatmap</p><h2 class="ex-title" id="ex1">' + esc(heatTitle(P)) + '</h2></div>' +
      '<p class="scroll-hint">Scroll the table sideways for all ten domains. Select a family to open its result.</p>' +
      heatmapHTML(P) +
      '<ul class="hm-key" aria-label="Domain key">' + DOMAINS.map(function (d) { return '<li><b>' + d.id + '</b>' + esc(d.short) + '</li>'; }).join('') + '</ul>' +
      '<div class="ex-foot">' + legendHTML() +
        '<p class="note">Cells show the average level (0–4) across the domain’s four questions; the colour shows the whole level reached, so 2.5 is coloured as level 2. Index is the readiness index.</p>' +
        '<p class="source">' + esc(sourceLine(P)) + '</p></div>' +
    '</section>' +
    '<div class="pf-grid">' +
      '<section class="exhibit" aria-labelledby="ex2">' +
        '<div class="ex-head"><p class="ex-label">Exhibit 2 · Readiness by domain</p><h2 class="ex-title" id="ex2">' + esc(barsTitle(P)) + '</h2></div>' +
        bars +
        '<div class="hbar-legend"><span><i class="k-bar"></i>Domain readiness</span><span><i class="k-bar" style="background:var(--signal)"></i>Weakest domain</span><span><i class="k-ref"></i>Portfolio index</span></div>' +
        '<p class="source">' + esc(sourceLine(P)) + '</p>' +
      '</section>' +
      '<section class="exhibit" aria-labelledby="ex3">' +
        '<div class="ex-head"><p class="ex-label">Exhibit 3 · Ten weakest questions</p><h2 class="ex-title" id="ex3">' + esc(weakestTitle(P)) + '</h2></div>' +
        '<ol class="wq">' + P.weakest.map(function (x, k) {
          return '<li class="wq-item"><span class="rank">' + (k + 1) + '</span><div><p class="wq-a">' + esc(x.q.action) + '</p>' +
            '<p class="wq-q"><span class="q-id">' + esc(x.q.id) + '</span>' + esc(x.q.text) + '</p><p class="basis">' + esc(x.q.basis) + '</p></div>' +
            '<div class="wq-score" data-tip="' + esc(x.q.id + '|Average level ' + fmt2(x.avg) + ' of 4 across ' + P.n + ' families') + '"><span class="wq-val">' + fmt2(x.avg) + '</span><span class="wq-bar" aria-hidden="true"><i style="width:' + (x.avg / 4 * 100).toFixed(1) + '%"></i></span><span class="wq-cap">average of 4</span></div></li>';

}
function heatCell(v, ready, who, d) {
  const b = bin(v);
  const tip = who + '|' + d.name + '|Average ' + fmt2(v) + ' of 4 · level reached ' + b + ' ' + LEVELS[b].name + '|Domain readiness ' + pct(ready) + '%';
  return '<td class="c m' + b + '" data-tip="' + esc(tip) + '">' + fmt1(v) + '</td>';
}
function idxCell(v) {
  return '<td class="idx"><span class="idx-val">' + pct(v) + '%</span><span class="idx-bar" aria-hidden="true"><i style="width:' + pct(v) + '%"></i></span></td>';
}
function heatmapHTML(P) {
  const sort = S.filters.sort;
  const ariaSort = sort === 'asc' ? 'ascending' : sort === 'desc' ? 'descending' : 'none';
  const glyph = sort === 'asc' ? '↑' : sort === 'desc' ? '↓' : '↕';
  const head = '<thead><tr><th scope="col" class="hm-fam-h">Product family</th>' + DOMAINS.map(function (d) {
    return '<th scope="col" abbr="' + esc(d.short) + '"><span class="hm-code">' + d.id + '</span><span class="hm-name">' + esc(softHyphens(d.short)) + '</span></th>';
  }).join('') + '<th scope="col" class="hm-ih" aria-sort="' + ariaSort + '"><button type="button" class="th-btn" data-act="sort-index" aria-label="Index, change sort order">Index<span class="sort-ind" aria-hidden="true">' + glyph + '</span></button></th></tr></thead>';
  const body = P.rows.map(function (r) {
    const f = r.fam;
    const meta = '<span class="fam-meta"><span>' + esc(f.bu) + '</span><span aria-hidden="true">·</span><span>' + esc(clsShort(f.cls)) + '</span><span aria-hidden="true">·</span><span>' + esc(waveShort(f.wave)) + '</span>' +
      (r.rec && r.rec.sample ? '<span class="tag tag-ill">Illustrative</span>' : r.rec ? '<span class="tag tag-live">' + esc(fmtDate(r.rec.time)) + '</span>' : '') + '</span>';
    const th = '<th scope="row"><a class="fam-link" href="#product-' + esc(f.id) + '">' + esc(f.name) + '</a>' + meta + '</th>';
    if (!r.rec) return '<tr data-fam="' + esc(f.id) + '">' + th + DOMAINS.map(function () { return '<td class="c na">–</td>'; }).join('') + '<td class="idx"><span class="muted">Not assessed</span></td></tr>';
    return '<tr data-fam="' + esc(f.id) + '">' + th + DOMAINS.map(function (d, i) { return heatCell(r.rec.dLevel[i], r.rec.dReady[i], f.name, d); }).join('') + idxCell(r.rec.index) + '</tr>';
  }).join('');
  const foot = P.n > 1 ? '<tfoot><tr class="hm-gap" aria-hidden="true"><td colspan="' + (DOMAINS.length + 2) + '"></td></tr><tr><th scope="row">Portfolio average<span class="fam-meta">' + P.n + ' families</span></th>' +
    DOMAINS.map(function (d, i) { return heatCell(P.dLevel[i], P.dReady[i], 'Portfolio average', d); }).join('') + idxCell(P.index) + '</tr></tfoot>' : '';
  return '<div class="hm-scroll" tabindex="0" role="region" aria-label="Maturity heatmap by product family and domain">' +
    '<table class="hm"><caption class="sr-only">Average maturity level from 0 to 4 for each product family and domain, latest submission per family, with the readiness index.</caption>' +
    '<colgroup><col class="col-fam">' + DOMAINS.map(function () { return '<col class="col-d">'; }).join('') + '<col class="col-idx"></colgroup>' +
    head + '<tbody>' + body + '</tbody>' + foot + '</table></div>';
}

/* ---------- product result ---------- */
function renderProduct() {
  const id = S.productId;
  const fam = findFamily(id);
  const recs = allRecords().filter(function (r) { return r.familyId === id; }).sort(function (a, b) { return b.time - a.time; });
  if (!fam && !recs.length) {
    view.innerHTML = '<div class="empty"><p class="empty-t" id="view-title" tabindex="-1">We could not find that product family</p><p>It may have been added in another view that has not loaded yet, or the link is incomplete.</p><p class="cta-row"><a class="btn btn-secondary btn-s" href="#portfolio">Back to the portfolio</a></p></div>';
    return;
  }
  const famObj = fam || { id: id, name: recs[0].familyName, short: recs[0].familyName, bu: recs[0].bu, cls: recs[0].cls, wave: recs[0].wave, route: '', known: false };
  if (!recs.length) {
    view.innerHTML = '<nav class="crumbs" aria-label="Breadcrumb"><a href="#portfolio">Portfolio</a><span aria-hidden="true">/</span><span>' + esc(famObj.name) + '</span></nav>' +
      '<div class="empty"><p class="empty-t" id="view-title" tabindex="-1">' + esc(famObj.name) + ' has no assessment in this view yet</p>' +
      '<p>' + (S.includeSamples ? 'No product team has submitted an assessment for this family.' : 'The illustrative baseline is switched off, and no product team has submitted an assessment for this family.') + '</p>' +
      '<p class="cta-row"><button type="button" class="btn btn-primary btn-s" data-act="assess-family" data-fam="' + esc(id) + '">Assess this product</button>' +
      (S.includeSamples ? '' : '<button type="button" class="btn btn-secondary btn-s" data-act="samples-on">Include illustrative sample data</button>') + '</p></div>';
    return;
  }
  let rec = recs[0];
  if (S.subId) { for (let i = 0; i < recs.length; i++) if (recs[i].id === S.subId) { rec = recs[i]; break; } }
  const P = computePortfolio(false);
  const older = rec !== recs[0];
  const who = rec.role + (rec.respondentName ? ' (' + rec.respondentName + ')' : '');
  const tags = '<span class="tags"><span class="tag mono">' + esc(famObj.id) + '</span><span class="tag">' + esc(famObj.bu) + '</span>' + clsTag(famObj.cls) +
    '<span class="tag">' + esc(famObj.wave || 'Not assigned') + '</span>' + (famObj.route ? '<span class="tag">' + esc(famObj.route) + '</span>' : '') +
    (rec.sample ? '<span class="tag tag-ill">Illustrative</span>' : '') + '</span>';
  const notes = Object.keys(rec.notes).sort(function (a, b) { return Q[a].order - Q[b].order; });
  view.innerHTML =
    '<header class="view-head">' +
      '<nav class="crumbs" aria-label="Breadcrumb"><a href="#portfolio">Portfolio</a><span aria-hidden="true">/</span><span>' + esc(famObj.name) + '</span></nav>' +
      '<p class="tracker">Product result · ' + esc(famObj.name) + '</p>' +
      '<h1 class="title" id="view-title" tabindex="-1">' + esc(productTitle(rec, famObj, P)) + '</h1>' +
      '<div class="prod-meta">' + tags + '<span>Assessed ' + esc(fmtDate(rec.time)) + (rec.sample ? '' : ', ' + esc(fmtTime(rec.time))) + ' by ' + esc(who) + '</span></div>' +
      '<div class="prod-actions"><button type="button" class="btn btn-secondary btn-s" data-act="copy-summary">Copy summary</button><button type="button" class="btn btn-primary btn-s" data-act="assess-family" data-fam="' + esc(famObj.id) + '">Assess this product</button></div>' +
      '<div class="fallback" id="copy-fallback" hidden></div>' +
    '</header>' +
    (older ? '<div class="banner warn" role="note"><span>You are viewing an earlier submission from ' + esc(fmtDate(rec.time)) + '. The portfolio uses the latest one.</span><button type="button" class="link-btn" data-act="view-sub" data-sub="">Show the latest</button></div>' : '') +
    '<div class="stack">' + resultBlocksHTML(rec, famObj, P, 'product') +
    (notes.length ? '<section class="exhibit" aria-labelledby="notes-h"><div class="ex-head"><p class="ex-label">Evidence notes</p><h2 class="ex-title" id="notes-h">' + cap(numw(notes.length)) + (notes.length === 1 ? ' note' : ' notes') + ' recorded with this submission.</h2></div><ul class="notes-list">' +
      notes.map(function (q) { return '<li><p class="a-q"><span class="q-id">' + esc(q) + '</span>' + esc(Q[q].text) + '</p><p class="note-text">' + esc(rec.notes[q]) + '</p></li>'; }).join('') + '</ul></section>' : '') +
    '<section class="exhibit" aria-labelledby="hist-h"><div class="ex-head"><p class="ex-label">Submission history</p><h2 class="ex-title" id="hist-h">' +

      '<ul class="history">' + recs.map(function (r) {

      }).join('') + '</ul></section>' +
    '</div>';
  S._viewRec = rec; S._viewFam = famObj; S._viewP = P;
}

function summaryText(rec, fam, P) {
  const L = [];
  L.push('CRA Readiness Diagnostic: ' + fam.name + ' (' + fam.id + ')');
  L.push('Example Group (illustrative) · ' + (BU_NAMES[fam.bu] || fam.bu) + ' · ' + fam.cls + ' · ' + (fam.wave || 'Not assigned'));
  L.push('Assessed ' + fmtDate(rec.time) + ' by ' + rec.role + (rec.respondentName ? ' (' + rec.respondentName + ')' : '') + (rec.sample ? ' · Illustrative baseline' : ''));
  L.push('');
  L.push('Readiness index: ' + pct(rec.index) + '%' + (P && P.index != null ? ' (portfolio ' + pct(P.index) + '%)' : '') + '; 100% = every question at level 3 or above.');
  L.push('');
  L.push('Average level by domain (0-4, target 3):');
  DOMAINS.forEach(function (d, i) { L.push('- ' + d.short + ': ' + fmt1(rec.dLevel[i])); });
  L.push('');
  L.push('Priority actions:');
  priorities(rec).forEach(function (p, k) { L.push((k + 1) + '. ' + p.q.action + ' [' + p.q.id + ', level ' + p.score + '; ' + p.q.basis + ']'); });
  L.push('');
  L.push('Source: CRA Readiness Diagnostic v1.0; facts as at 30 Oct 2026; Illustrative.');
  return L.join('\n');
}

/* ---------- assessment ---------- */
function draftFamily(d) {
  if (!d || !d.familyId) return null;
  if (d.familyId === '__new') {
    const n = d.newFamily;
    if (!n.name || !n.bu || !n.cls) return null;
    return { id: 'new-' + (slug(n.name) || 'x' + hash36(n.name.trim().toLowerCase())), name: n.name.trim(), short: n.name.trim(), bu: n.bu, cls: n.cls, wave: 'Not assigned', route: '', known: false };
  }
  return findFamily(d.familyId);
}
function renderAssess() {
  if (S.pendingFamily) return renderChoice();
  if (!S.draft) S.draft = newDraft('');
  const d = S.draft;
  if (d.step >= 1 && (!draftFamily(d) || !d.role.trim())) d.step = 0;
  if (d.step === 0) return renderSetup();
  if (d.step <= DOMAINS.length) return renderStep(d.step);
  return renderReview();
}
function renderChoice() {
  const d = S.draft, target = findFamily(S.pendingFamily), cur = draftFamily(d);
  view.innerHTML = '<header class="view-head"><p class="tracker">Assess a product</p><h1 class="title" id="view-title" tabindex="-1">You already have a draft in progress.</h1>' +
    '<p class="insight">Your draft for ' + esc(cur ? cur.name : 'an unnamed family') + ' has ' + answeredCount(d) + ' of 40 answers. Starting ' + esc(target ? target.name : 'a new assessment') + ' replaces that draft in this browser.</p></header>' +
    '<div class="form-actions"><button type="button" class="btn btn-primary" data-act="keep-draft">Continue my draft</button><button type="button" class="btn btn-secondary" data-act="replace-draft">Start ' + esc(target ? shortName(target) : 'new') + ' instead</button></div>';
}
function familyLastText(latest, f) {

  return 'Latest ' + pct(r.index) + '% · ' + fmtDate(r.time) + (r.sample ? ' · illustrative' : '');
}

    }).join('') + '</div></div>';

/* ================= routing ================= */
const ROUTES = { overview: renderOverview, assess: renderAssess, portfolio: renderPortfolio, method: renderMethod };
function parseHash() {
  const h = (location.hash || '').replace(/^#/, '');
  if (!h) return { route: 'overview' };
  if (ROUTES[h]) return { route: h };
  if (h.indexOf('product-') === 0) { const id = cleanId(h.slice(8)); if (id) return { route: 'product', id: id }; }
  return null;
}
function render(opts) {
  opts = opts || {};
  hideTip();
  if (S.route === 'product') renderProduct(); else ROUTES[S.route]();
  document.querySelectorAll('[data-nav]').forEach(function (a) {
    const on = a.getAttribute('data-nav') === S.route || (S.route === 'product' && a.getAttribute('data-nav') === 'portfolio');
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  if (opts.top) { window.scrollTo(0, 0); }
  if (opts.focus) setTitleFocus();
}
function route(first) {
  let r = parseHash();
  if (!r) { if (!first) return; r = { route: 'overview' }; }
  const changed = r.route !== S.route || r.id !== S.productId;
  if (r.route === 'product' && r.id !== S.productId) S.subId = S.subId && S.pendingSub === r.id ? S.subId : null;
  S.pendingSub = null;
  S.route = r.route; S.productId = r.id || null;
  render({ top: changed && !first, focus: changed && !first });
}
function go(hash) {
  if (location.hash === '#' + hash) route(); else location.hash = hash;
}

/* ================= live data ================= */
function onData() {
  paintStatus();
  if (S.route === 'portfolio') renderPortfolioContent();
  else if (S.route === 'overview') { const s = document.getElementById('snapshot'); if (s) s.innerHTML = snapshotHTML(computePortfolio(false)); }
  else if (S.route === 'product') render();
  else if (S.route === 'assess' && S.draft && S.draft.step === 11 && !S.submitting) render();
}
function subscribe() {
  if (!S.db) return;
  if (S.unsub) { try { S.unsub(); } catch (e) { /* already closed */ } S.unsub = null; }
  S.dbState = 'connecting'; paintStatus();
  try {
    S.unsub = S.db.collection(COLL).orderBy('submittedAt', 'desc').limit(1000).onSnapshot(function (snap) {
      const out = []; let skipped = 0;
      snap.docs.forEach(function (doc) { const r = normalise(doc.id, doc.data()); if (r) out.push(r); else skipped++; });
      S.live = out; S.skipped = skipped; S.dbState = 'live'; S.dbError = null;
      onData();
    }, function (err) {
      S.dbError = err; S.dbState = err && err.code === 'revoked' ? 'revoked' : 'error';
      S.unsub = null;
      onData();
    });
  } catch (e) {
    S.dbError = e; S.dbState = 'error'; onData();
  }
}
async function connect() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { S.dbState = 'offline'; onData(); return; }
  c.use('downloads').then(function (ns) { S.downloads = ns || null; }, function () { S.downloads = null; });
  c.use('user').then(async function (u) {
    if (!u) return;
    try { S.canWrite = await u.can('data.write'); } catch (e) { S.canWrite = null; }
    try { S.userId = await u.id(); } catch (e) { S.userId = null; }
    if (S.route === 'assess' && S.draft && S.draft.step === 11) render();
  }, function () { /* no viewer identity */ });
  let db = null;
  try { db = await c.use('db'); } catch (e) { db = null; }
  if (!db) { S.dbState = 'offline'; onData(); return; }
  S.db = db;
  subscribe();
}

async function submit() {
  const d = S.draft;
  if (!d || S.submitting) return;
  const f = draftFamily(d);
  if (!f || answeredCount(d) < QIDS.length || !d.role.trim()) return;
  if (!S.db) { S.submitMsg = { text: 'Live results are not available in this view, so the assessment cannot be submitted from here. Your answers stay in this browser.', bad: true }; render(); return; }
  if (!d.subId) { d.subId = newId(); }
  saveDraftNow();
  const notes = {};
  QIDS.forEach(function (q) { const n = (d.notes[q] || '').trim(); if (n) notes[q] = n.slice(0, NOTE_MAX); });
  const answers = {};
  QIDS.forEach(function (q) { answers[q] = d.answers[q]; });
  const body = {
    schema: 1, familyId: f.id, familyName: f.name, bu: f.bu, cls: f.cls, wave: f.wave || 'Not assigned', newFamily: !f.known,
    role: d.role.trim().slice(0, 120), respondentName: (d.name || '').trim().slice(0, 120),
    answers: answers, notes: notes, submittedAt: new Date().toISOString(), sample: false, by: S.userId || null,
    index: Math.round(famIndex(answers) * 1000) / 1000
  };
  S.submitting = true; S.submitMsg = { text: 'Submitting…' }; render();
  const ref = S.db.collection(COLL).doc(d.subId);
  try {
    try { await ref.set(body); }
    catch (e) {
      const code = e && e.code;
      if (code && code !== 'unavailable' && ['invalid_argument', 'quota_exceeded', 'resource_exhausted', 'revoked', 'not_granted', 'capability_disabled', 'capability_removed', 'transform_error'].indexOf(code) > -1) throw e;
      await sleep(600 + Math.random() * 900);
      await ref.set(body);
    }
  } catch (e) {
    S.submitting = false;
    S.submitMsg = submitError(e);
    if (S.route === 'assess') render();
    return;
  }
  const rec = normalise(d.subId, body);
  if (rec && !S.live.some(function (r) { return r.id === rec.id; })) S.live = S.live.concat([rec]);
  S.submitting = false; S.submitMsg = null;
  clearDraft();
  toast('Submitted. ' + f.name + ' now shows this assessment in the portfolio.');
  S.subId = rec ? rec.id : null; S.pendingSub = f.id;
  go('product-' + f.id);
}
function submitError(e) {
  const code = e && e.code;
  if (code === 'invalid_argument') return { bad: true, text: 'This view cannot add to the shared portfolio; your access may be view-only. Ask the programme team for contributor access. Your answers stay in this browser.' };
  if (code === 'quota_exceeded') return { bad: true, text: 'The shared database is full. Ask the programme team to archive old submissions. Your answers stay in this browser.' };
  if (code === 'resource_exhausted') return { bad: true, retry: true, text: 'Too many requests just now. Wait a few seconds.' };
  if (code === 'revoked') return { bad: true, text: 'Access to the shared portfolio ended for this view. Reload the page; your answers stay in this browser.' };
  if (code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') return { bad: true, text: 'Live results are not available in this view. Your answers stay in this browser.' };
  return { bad: true, retry: true, text: 'The shared database did not respond. Your answers stay in this browser.' };
}

  if (v == null) return '';

  let s = String(v);

  if (/[",\r\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function buildCsv() {
  const P = computePortfolio(false);
  const head = ['family_id', 'family_name', 'business_unit', 'cra_class', 'wave', 'respondent_role', 'respondent_name', 'submitted_at', 'illustrative', 'readiness_index_pct']
    .concat(DOMAINS.map(function (d) { return d.id + ' ' + d.short + ' (avg level)'; })).concat(QIDS).concat(['notes']);
  const lines = [head.map(csvCell).join(',')];
  P.assessed.forEach(function (r) {
    const rec = r.rec, f = r.fam;
    const notes = Object.keys(rec.notes).sort(function (a, b) { return Q[a].order - Q[b].order; }).map(function (q) { return q + ': ' + rec.notes[q]; }).join(' | ');
    lines.push([f.id, f.name, f.bu, f.cls, f.wave || 'Not assigned', rec.role, rec.respondentName, new Date(rec.time).toISOString(), rec.sample ? 'yes' : 'no', pct(rec.index)]
      .concat(rec.dLevel.map(function (v) { return Math.round(v * 100) / 100; }))
      .concat(QIDS.map(function (q) { return rec.answers[q]; })).concat([notes]).map(csvCell).join(','));
  });
  return { csv: '﻿' + lines.join('\r\n') + '\r\n', rows: P.assessed.length };
}
function showFallback(hostId, text, label) {
  const host = document.getElementById(hostId);
  if (!host) return;
  host.hidden = false;
  host.innerHTML = '<p class="note">' + esc(label) + '</p><textarea id="' + hostId + '-text" readonly aria-label="' + esc(label) + '"></textarea>' +
    '<p class="cta-row"><button type="button" class="btn btn-secondary btn-s" data-act="copy-fallback" data-host="' + hostId + '">Copy</button><button type="button" class="btn btn-quiet btn-s" data-act="close-fallback" data-host="' + hostId + '">Close</button></p>';
  const ta = document.getElementById(hostId + '-text');
  ta.value = text;
  ta.focus(); ta.select();
}
function copyText(text, hostId, label, okMsg) {
  try {
    if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('no clipboard');
    navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, function () { showFallback(hostId, text, label); });
  } catch (e) { showFallback(hostId, text, label); }
}
function exportCsv() {
  const out = buildCsv();
  if (!out.rows) { toast('Nothing to export yet.'); return; }
  const stamp = new Date();
  const fname = 'cra-readiness-latest-' + stamp.getFullYear() + '-' + String(stamp.getMonth() + 1).padStart(2, '0') + '-' + String(stamp.getDate()).padStart(2, '0') + '.csv';
  if (S.downloads && typeof S.downloads.save === 'function') {
    S.downloads.save({ filename: fname, data: out.csv }).then(function () { toast('CSV ready: ' + out.rows + ' families, latest submission each.'); }, function (e) {
      const code = e && e.code;
      if (code === 'declined') toast('Download cancelled.');
      else if (code === 'rate_limited') toast('A download prompt is already open.');
      else showFallback('export-fallback', out.csv, 'Downloads are not available in this view. Copy the CSV below and paste it into a spreadsheet.');
    });
    return;
  }
  showFallback('export-fallback', out.csv, 'Downloads are not available in this view. Copy the CSV below and paste it into a spreadsheet.');
}

/* ================= toast and tooltip ================= */
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 4200);
}
const tip = document.getElementById('tip');
let tipEl = null;
function showTip(el, x, y) {
  const lines = String(el.getAttribute('data-tip') || '').split('|');
  tip.textContent = '';
  lines.forEach(function (l, i) { const n = document.createElement(i === 0 ? 'b' : 'span'); n.textContent = l; tip.appendChild(n); if (i > 0) tip.appendChild(document.createElement('br')); });
  tip.hidden = false; tipEl = el;
  placeTip(x, y);
}
function placeTip(x, y) {
  const w = tip.offsetWidth, h = tip.offsetHeight, vw = document.documentElement.clientWidth, vh = window.innerHeight;
  let left = x + 14, top = y + 16;
  if (left + w > vw - 8) left = Math.max(8, x - w - 14);
  if (top + h > vh - 8) top = Math.max(8, y - h - 14);
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
function hideTip() { tip.hidden = true; tipEl = null; }
document.addEventListener('pointerover', function (e) {
  if (e.pointerType === 'touch') return;
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el && el !== tipEl) showTip(el, e.clientX, e.clientY);
});
document.addEventListener('pointermove', function (e) { if (tipEl) placeTip(e.clientX, e.clientY); });
document.addEventListener('pointerout', function (e) {
  if (!tipEl) return;
  const to = e.relatedTarget;
  if (!to || !tipEl.contains(to)) { const el = to && to.closest && to.closest('[data-tip]'); if (!el) hideTip(); }
});
window.addEventListener('scroll', function () { if (tipEl) hideTip(); }, { passive: true });

/* ================= events ================= */
function setDraftField(fn) { if (!S.draft) S.draft = newDraft(''); fn(S.draft); saveDraftSoon(); }
function updateStepUI(qid) {
  const q = Q[qid];
  const k = qid.replace('.', '-');
  const desc = document.getElementById('desc-' + k);
  if (desc) desc.innerHTML = descText(S.draft.answers[qid]);
  const n = answeredCount(S.draft);
  document.querySelectorAll('[data-answered]').forEach(function (el) { el.textContent = n; });
  const bar = document.querySelector('[data-stbar="' + q.domain.id + '"] i');
  const m = q.domain.questions.filter(function (x) { return S.draft.answers[x.id] !== undefined; }).length;
  if (bar) bar.style.width = (m / 4 * 100) + '%';
  const st = bar && bar.closest('.st');
  if (st) st.setAttribute('aria-label', q.domain.id + ' ' + q.domain.name + ', ' + m + ' of 4 answered');
  const hint = document.querySelector('[data-stephint]');
  if (hint) hint.textContent = stepHint(q.domain);
}
function gotoStep(n, focusQ) {
  S.draft.step = n; S.submitMsg = null; saveDraftNow(); render({ top: true });
  if (focusQ) {
    const el = document.getElementById('q-' + focusQ.replace('.', '-'));
    if (el) { el.scrollIntoView({ block: 'center' }); const r = el.querySelector('input'); if (r) r.focus({ preventScroll: true }); }
  } else setTitleFocus();
}

document.addEventListener('change', function (e) {
  const t = e.target;
  if (t.matches('.seg input[type="radio"]')) {
    setDraftField(function (d) { d.answers[t.name] = Number(t.value); });
    updateStepUI(t.name);
    return;
  }
  if (t.name === 'family') {
    setDraftField(function (d) { d.familyId = t.value; });
    const nf = document.getElementById('new-fam');
    if (nf) nf.hidden = t.value !== '__new';
    const ef = document.getElementById('err-family'); if (ef) ef.hidden = true;
    if (t.value === '__new') { const n = document.getElementById('nf-name'); if (n && !n.value) n.focus(); }
    return;
  }
  if (t.id === 'nf-bu') { setDraftField(function (d) { d.newFamily.bu = t.value; }); t.removeAttribute('aria-invalid'); return; }
  if (t.id === 'nf-cls') { setDraftField(function (d) { d.newFamily.cls = t.value; }); t.removeAttribute('aria-invalid'); return; }
  if (t.matches('[data-filter]')) { S.filters[t.getAttribute('data-filter')] = t.value; savePrefs(); renderPortfolioContent(); return; }
  if (t.id === 'f-samples') { S.includeSamples = t.checked; savePrefs(); renderPortfolioContent(); paintStatus(); return; }
});
document.addEventListener('input', function (e) {
  const t = e.target;
  if (t.matches('textarea[data-note]')) {
    const q = t.getAttribute('data-note');
    setDraftField(function (d) { if (t.value) d.notes[q] = t.value.slice(0, NOTE_MAX); else delete d.notes[q]; });
    const c = document.querySelector('[data-count="' + q + '"]'); if (c) c.textContent = t.value.length.toLocaleString('en-GB') + ' / 2,000';
    return;
  }
  if (t.id === 'role') { setDraftField(function (d) { d.role = t.value.slice(0, 120); }); if (t.value.trim()) { t.removeAttribute('aria-invalid'); document.getElementById('err-role').hidden = true; } return; }
  if (t.id === 'rname') { setDraftField(function (d) { d.name = t.value.slice(0, 120); }); return; }
  if (t.id === 'nf-name') { setDraftField(function (d) { d.newFamily.name = t.value.slice(0, 80); }); t.removeAttribute('aria-invalid'); return; }
});
document.addEventListener('submit', function (e) {
  if (e.target.id !== 'setup-form') return;
  e.preventDefault();
  if (!validateSetup(true)) return;
  const back = S.draft.resumeStep;
  delete S.draft.resumeStep;
  S.draft.step = back >= 1 && back <= 11 ? back : 1;
  if (S.draft.step <= DOMAINS.length && answeredCount(S.draft) === QIDS.length && !back) S.draft.step = 11;
  saveDraftNow(); render({ top: true, focus: true });
});
document.addEventListener('click', function (e) {
  const a = e.target.closest('[data-act]');
  if (!a) {
    const row = e.target.closest('.hm tbody tr[data-fam]');
    if (row && !e.target.closest('a')) { S.subId = null; go('product-' + row.getAttribute('data-fam')); }
    return;
  }
  const act = a.getAttribute('data-act');
  switch (act) {
    case 'skip': e.preventDefault(); document.getElementById('main').focus(); break;
    case 'prev': {
      const d = S.draft; if (!d) break;
      if (d.step === 11) gotoStep(DOMAINS.length); else gotoStep(Math.max(0, d.step - 1));
      break;
    }
    case 'next': { const d = S.draft; if (!d) break; gotoStep(d.step >= DOMAINS.length ? 11 : d.step + 1); break; }
    case 'goto-step': { if (!S.draft || S.route !== 'assess') break; gotoStep(Number(a.getAttribute('data-step')), a.getAttribute('data-focus')); break; }
    case 'edit-setup': S.draft.resumeStep = S.draft.step; gotoStep(0); break;
    case 'toggle-note': {
      const q = a.getAttribute('data-q'), k = q.replace('.', '-');
      const w = document.getElementById('notewrap-' + k);
      const open = w.hidden;
      w.hidden = !open; a.setAttribute('aria-expanded', String(open)); a.textContent = open ? 'Hide note' : 'Add a note';
      if (open) document.getElementById('note-' + k).focus();
      break;
    }
    case 'discard': {
      const host = a.closest('[data-confirm]');
      host.innerHTML = '<span>Discard all answers in this draft?</span><button type="button" class="btn btn-danger btn-s" data-act="discard-yes">Discard</button><button type="button" class="btn btn-quiet btn-s" data-act="discard-no">Keep</button>';
      host.querySelector('[data-act="discard-no"]').focus();
      break;
    }
    case 'discard-no': render(); break;
    case 'discard-yes': clearDraft(); S.draft = newDraft(''); S.submitMsg = null; render({ top: true, focus: true }); toast('Draft discarded.'); break;
    case 'submit': submit(); break;
    case 'retry-db': subscribe(); break;
    case 'export': exportCsv(); break;
    case 'copy-summary': if (S._viewRec) copyText(summaryText(S._viewRec, S._viewFam, S._viewP), 'copy-fallback', 'Copy the summary below.', 'Summary copied to the clipboard.'); break;
    case 'copy-fallback': {
      const ta = document.getElementById(a.getAttribute('data-host') + '-text');
      if (ta) { ta.focus(); ta.select(); try { navigator.clipboard.writeText(ta.value).then(function () { toast('Copied.'); }, function () { toast('Press Ctrl+C or Cmd+C to copy the selected text.'); }); } catch (err) { toast('Press Ctrl+C or Cmd+C to copy the selected text.'); } }
      break;
    }
    case 'close-fallback': { const h = document.getElementById(a.getAttribute('data-host')); if (h) { h.hidden = true; h.innerHTML = ''; } break; }
    case 'assess-family': {
      const id = a.getAttribute('data-fam');
      const d = S.draft;
      if (hasProgress(d) && d.familyId && d.familyId !== id && answeredCount(d) > 0) { S.pendingFamily = id; }
      else if (!d || !answeredCount(d) || d.familyId === id) { const keep = d && d.familyId === id ? d : newDraft(id); if (keep !== d) { keep.role = d ? d.role : ''; keep.name = d ? d.name : ''; } S.draft = keep; saveDraftNow(); }
      go('assess');
      break;
    }
    case 'keep-draft': S.pendingFamily = null; render({ top: true, focus: true }); break;
    case 'replace-draft': {
      const old = S.draft; const id = S.pendingFamily;
      S.pendingFamily = null; S.draft = newDraft(id); if (old) { S.draft.role = old.role; S.draft.name = old.name; }
      saveDraftNow(); render({ top: true, focus: true });
      break;
    }
    case 'view-sub': S.subId = a.getAttribute('data-sub') || null; render({ top: true }); break;
    case 'sort-index': S.filters.sort = S.filters.sort === 'asc' ? 'desc' : S.filters.sort === 'desc' ? 'portfolio' : 'asc'; savePrefs(); { const sel = document.getElementById('f-sort'); if (sel) sel.value = S.filters.sort; } renderPortfolioContent(); { const b = document.querySelector('[data-act="sort-index"]'); if (b) b.focus(); } break;
    case 'clear-filters': S.filters = { bu: 'all', cls: 'all', wave: 'all', sort: S.filters.sort }; savePrefs(); renderPortfolio(); break;
    case 'samples-on': S.includeSamples = true; savePrefs(); render(); break;
  }
});
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && saveTimer) saveDraftNow(); });
window.addEventListener('pagehide', function () { if (saveTimer) saveDraftNow(); });
window.addEventListener('hashchange', function () { route(false); });

/* ================= boot ================= */
route(true);
connect();
})();
</script>
