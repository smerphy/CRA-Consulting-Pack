<title>CRA Readiness Diagnostic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap">
<style>
/* Layout: a calm consulting workspace. Each view opens with a tracker label and a serif action title;
   exhibits sit on white surfaces over warm paper; teal is the single accent and signal orange marks the binding gap. */
:root {
  --paper: #FAFAF7;
  --surface: #FFFFFF;
  --sunken: #F4F6F8;
  --ink: #0E1A2B;
  --ink-2: #26364D;
  --muted: #56667E;
  --rule: #C5CDD8;
  --rule-soft: #E3E8EE;
  --fill: #EEF1F5;
  --accent: #0F6E6A;
  --accent-strong: #0A5753;
  --accent-soft: #DCEFEC;
  --accent-ink: #0A5753;
  --on-accent: #FFFFFF;
  --link: #0A5753;
  --signal: #C2410C;
  --danger: #B42318;
  --warn: #B54708;
  --ok: #027A48;
  --m0: #B42318;
  --m1: #E07A5F;
  --m2: #E9C46A;
  --m3: #7FB8A4;
  --m4: #0F6E6A;
  --on-dark: #FFFFFF;
  --on-light: #0E1A2B;
  --focus: #0F6E6A;
  --shadow: 0 1px 2px rgba(14, 26, 43, .05), 0 10px 28px rgba(14, 26, 43, .06);
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body: Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r-s: 2px;
  --r-m: 4px;
  --r-l: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1A2B; --surface: #14233A; --sunken: #101E33;
    --ink: #F2F3EF; --ink-2: #D3DAE4; --muted: #A3AFC0;
    --rule: #33465F; --rule-soft: #24364F; --fill: #1C2D47;
    --accent: #2E9C93; --accent-strong: #5FBDB4; --accent-soft: #163B41; --accent-ink: #8FD3CB;
    --on-accent: #0E1A2B; --link: #8FD3CB;
    --signal: #EA7A45; --danger: #F97066; --warn: #F2A25C; --ok: #4CC38A;
    --focus: #5FBDB4;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .22);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1A2B; --surface: #14233A; --sunken: #101E33;
  --ink: #F2F3EF; --ink-2: #D3DAE4; --muted: #A3AFC0;
  --rule: #33465F; --rule-soft: #24364F; --fill: #1C2D47;
  --accent: #2E9C93; --accent-strong: #5FBDB4; --accent-soft: #163B41; --accent-ink: #8FD3CB;
  --on-accent: #0E1A2B; --link: #8FD3CB;
  --signal: #EA7A45; --danger: #F97066; --warn: #F2A25C; --ok: #4CC38A;
  --focus: #5FBDB4;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .22);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--paper); }
a { color: var(--link); text-underline-offset: 3px; }
a:hover { color: var(--accent-strong); }
p { margin: 0; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button { font: inherit; color: inherit; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.mono { font-family: var(--font-mono); font-size: .86em; }
.muted { color: var(--muted); }
.nw { white-space: nowrap; }
.skip { position: absolute; left: -9999px; top: 8px; z-index: 50; background: var(--surface); color: var(--ink); padding: 10px 14px; border-radius: var(--r-m); box-shadow: var(--shadow); }
.skip:focus { left: max(16px, env(safe-area-inset-left, 0px)); }

.wrap { max-width: 1200px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 768px) {
  .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); }
}

/* ---------- top bar ---------- */
.topbar { background: var(--paper); border-bottom: 1px solid var(--rule-soft); }
@media (min-width: 768px) { .topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; } }
.topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 8px 20px; min-height: 64px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; min-width: 0; }
.brand:hover { color: var(--ink); }
.brand-mark { display: flex; align-items: flex-end; gap: 2px; height: 18px; flex: none; }
.brand-mark i { display: block; width: 5px; border-radius: 1px; }
.brand-mark i:nth-child(1) { height: 6px; background: var(--m0); }
.brand-mark i:nth-child(2) { height: 9px; background: var(--m1); }
.brand-mark i:nth-child(3) { height: 12px; background: var(--m2); }
.brand-mark i:nth-child(4) { height: 15px; background: var(--m3); }
.brand-mark i:nth-child(5) { height: 18px; background: var(--m4); }
.brand-text { display: grid; min-width: 0; }
.brand-name { font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.15; letter-spacing: -.005em; }
.brand-sub { font-size: 11.5px; color: var(--muted); letter-spacing: .02em; }
.nav { display: flex; gap: 2px; }
.nav a { position: relative; display: inline-flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: var(--r-m); color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 14px; }
.nav a:hover { background: var(--fill); color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); font-weight: 600; }
.nav a[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 4px; height: 2px; border-radius: 1px; background: var(--accent); }
@media (max-width: 640px) {
  .topbar-inner { padding-block: 10px 4px; }
  .brand-sub { display: none; }
  .nav { width: 100%; justify-content: space-between; margin-inline: -8px; width: calc(100% + 16px); }
  .nav a { flex: 1; justify-content: center; padding: 0 6px; font-size: 13.5px; }
  .nav a[aria-current="page"]::after { left: 18%; right: 18%; }
}

/* ---------- page frame ---------- */
main { display: block; padding-block: 32px 72px; }
@media (min-width: 768px) { main { padding-block: 48px 96px; } }
main:focus { outline: none; }
#view { display: grid; gap: 32px; min-width: 0; }
@media (min-width: 768px) { #view { gap: 40px; } }
.ov { display: grid; gap: 56px; min-width: 0; }
@media (min-width: 768px) { .ov { gap: 72px; } }
.assess-wrap { display: grid; gap: 28px; min-width: 0; }
.stack { display: grid; gap: 24px; min-width: 0; }
.stack-s { display: grid; gap: 12px; min-width: 0; }

.tracker { font-size: 11.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.display { font-family: var(--font-display); font-weight: 600; font-size: clamp(31px, 4.3vw, 50px); line-height: 1.08; letter-spacing: -.018em; }
.title { font-family: var(--font-display); font-weight: 600; font-size: clamp(25px, 3vw, 34px); line-height: 1.17; letter-spacing: -.012em; }
.title:focus, .display:focus { outline: none; }
.h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(20px, 2.1vw, 24px); line-height: 1.28; letter-spacing: -.006em; }
.lede { font-size: 17px; line-height: 1.6; color: var(--ink-2); max-width: 60ch; }
.insight { font-size: 16px; line-height: 1.55; color: var(--ink-2); max-width: 72ch; }
.view-head { display: grid; gap: 12px; max-width: 900px; }
.source { font-size: 12px; line-height: 1.5; color: var(--muted); }
.note { font-size: 12.5px; line-height: 1.5; color: var(--muted); }

/* ---------- buttons, tags, controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: var(--r-m); font: 600 14.5px/1.2 var(--font-body); text-decoration: none; cursor: pointer; border: 1px solid transparent; transition: background-color .15s, border-color .15s, color .15s; white-space: nowrap; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-strong); color: var(--on-accent); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--rule); }
.btn-secondary:hover { border-color: var(--ink-2); color: var(--ink); }
.btn-quiet { background: transparent; color: var(--ink-2); border-color: transparent; padding: 0 12px; }
.btn-quiet:hover { background: var(--fill); color: var(--ink); }
.btn-danger { background: var(--danger); color: var(--on-dark); }
.btn-s { min-height: 38px; padding: 0 14px; font-size: 14px; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.link-btn { background: none; border: 0; padding: 4px 0; font: 500 13.5px/1.4 var(--font-body); color: var(--link); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.link-btn:hover { color: var(--accent-strong); }
.arrow-link { font-weight: 600; font-size: 14px; text-decoration: none; }
.arrow-link:hover { text-decoration: underline; }

.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: var(--r-s); font-size: 11.5px; font-weight: 600; letter-spacing: .01em; border: 1px solid var(--rule); color: var(--ink-2); background: transparent; white-space: nowrap; line-height: 1; }
.tag-c1 { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }
.tag-c2 { background: var(--ink-2); border-color: transparent; color: var(--paper); }
.tag-ill { background: var(--fill); border-color: transparent; color: var(--muted); font-weight: 500; font-style: italic; }
.tag-live { background: transparent; border-color: var(--accent); color: var(--accent-ink); }
.tags { display: inline-flex; flex-wrap: wrap; gap: 6px; }

.lvl-chip { display: inline-grid; place-items: center; min-width: 30px; height: 26px; padding: 0 6px; border-radius: var(--r-s); font-weight: 600; font-size: 13.5px; font-variant-numeric: tabular-nums; flex: none; }
.m0 { background: var(--m0); color: var(--on-dark); }
.m1 { background: var(--m1); color: var(--on-light); }
.m2 { background: var(--m2); color: var(--on-light); }
.m3 { background: var(--m3); color: var(--on-light); }
.m4 { background: var(--m4); color: var(--on-dark); }

.sel { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; }
.sel-box { position: relative; }
.sel-box::after { content: ""; position: absolute; right: 13px; top: 50%; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
select, input[type="text"], textarea {
  width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--r-m);
  background: var(--surface); color: var(--ink); font: 400 15px/1.4 var(--font-body);
}
select { appearance: none; -webkit-appearance: none; padding-right: 34px; cursor: pointer; font-weight: 500; }
.sel select { min-height: 38px; padding-block: 6px; font-size: 14px; min-width: 9.5em; }
textarea { resize: vertical; line-height: 1.5; }
input[type="text"]:hover, select:hover, textarea:hover { border-color: var(--muted); }
[aria-invalid="true"] { border-color: var(--danger) !important; }
.err { color: var(--danger); font-size: 13px; font-weight: 500; }

.switch { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: var(--ink-2); cursor: pointer; min-height: 38px; }
.switch input { appearance: none; -webkit-appearance: none; flex: none; margin: 0; width: 38px; height: 22px; border-radius: 11px; background: var(--muted); position: relative; cursor: pointer; transition: background-color .15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(16px); }

/* ---------- overview ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 56px; align-items: start; }
@media (max-width: 980px) { .hero { grid-template-columns: minmax(0, 1fr); gap: 36px; } }
.hero-copy { display: grid; gap: 22px; align-content: start; min-width: 0; }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; }
.clock { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 6px 0 0; border-top: 1px solid var(--rule); }
.clock div { padding: 14px 16px 0 0; }
.clock dt { font-size: 12px; color: var(--muted); font-weight: 500; }
.clock dd { margin: 3px 0 0; font-size: 14.5px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
@media (max-width: 560px) {
  .clock { grid-template-columns: 1fr; }
  .clock div { padding: 12px 0; border-bottom: 1px solid var(--rule-soft); display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .clock dd { margin: 0; text-align: right; }
}
.draft-note { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 16px; border: 1px solid var(--rule); border-radius: var(--r-l); background: var(--surface); }
.draft-note p { flex: 1 1 240px; font-size: 14px; color: var(--ink-2); }
.draft-note strong { color: var(--ink); }

.snapshot { background: var(--surface); border: 1px solid var(--rule-soft); border-radius: var(--r-l); padding: 24px; display: grid; gap: 18px; box-shadow: var(--shadow); min-width: 0; }
.snap-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.snap-figure { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.hero-num { font-size: 64px; font-weight: 600; letter-spacing: -.035em; line-height: .86; color: var(--ink); }
.snap-cap { display: grid; gap: 2px; font-size: 14px; line-height: 1.35; font-weight: 600; padding-bottom: 2px; }
.snap-cap .muted { font-weight: 400; font-size: 13px; }
.snap-bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.snap-bars li { display: grid; grid-template-columns: minmax(0, 10.5em) minmax(0, 1fr) 2.8em; align-items: center; gap: 12px; font-size: 13px; color: var(--ink-2); }
.sb-name { overflow-wrap: anywhere; }
.sb-track { height: 8px; background: var(--fill); border-radius: 2px; overflow: hidden; }
.sb-track i { display: block; height: 100%; background: var(--accent); border-radius: 0 2px 2px 0; }
.sb-track i.weak { background: var(--signal); }
.sb-val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
.snap-status { font-size: 12.5px; color: var(--muted); }

.section { display: grid; gap: 22px; min-width: 0; }
.section-head { display: grid; gap: 8px; max-width: 780px; }
.domain-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--rule-soft); border: 1px solid var(--rule-soft); border-radius: var(--r-l); overflow: hidden; }
.domain-grid li { background: var(--surface); padding: 18px 16px 20px; display: grid; gap: 6px; align-content: start; min-width: 0; }
@media (max-width: 1080px) { .domain-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .domain-grid { grid-template-columns: minmax(0, 1fr); } }
.dg-code { font-family: var(--font-mono); font-size: 11.5px; color: var(--accent-ink); font-weight: 500; }
.dg-name { font-weight: 600; font-size: 15px; line-height: 1.3; }
.dg-anchor { font-family: var(--font-mono); font-size: 11px; color: var(--muted); line-height: 1.5; overflow-wrap: anywhere; }

.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 56px; }
@media (max-width: 900px) { .split { grid-template-columns: minmax(0, 1fr); gap: 48px; } }
.scale { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.scale li { display: grid; grid-template-columns: 34px minmax(0, 8.5em) minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule-soft); }
.sc-name { font-weight: 600; font-size: 14.5px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.sc-desc { font-size: 14px; color: var(--ink-2); }
.target-flag { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--accent-ink); border: 1px solid currentColor; border-radius: 2px; padding: 1px 5px; }
@media (max-width: 480px) { .scale li { grid-template-columns: 34px minmax(0, 1fr); } .sc-desc { grid-column: 2; } }
.formula { display: grid; gap: 4px; font-family: var(--font-mono); font-size: 14px; line-height: 1.5; background: var(--fill); color: var(--ink); border-radius: var(--r-m); padding: 16px 18px; overflow-x: auto; }
.formula-c { font-size: 12px; color: var(--muted); }
.facts { margin: 0; padding-left: 1.15em; display: grid; gap: 10px; color: var(--ink-2); font-size: 15px; }
.facts strong { color: var(--ink); }

/* ---------- exhibits ---------- */
.exhibit { background: var(--surface); border: 1px solid var(--rule-soft); border-radius: var(--r-l); padding: 24px; display: grid; gap: 18px; min-width: 0; align-content: start; }
@media (max-width: 640px) { .exhibit { padding: 18px 14px; } }
.ex-head { display: grid; gap: 6px; }
.ex-label { font-size: 11.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.ex-title { font-family: var(--font-display); font-weight: 600; font-size: 20px; line-height: 1.3; letter-spacing: -.004em; }
.ex-foot { display: grid; gap: 6px; }

.toolbar { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; padding: 16px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule-soft); }
.filters { display: flex; flex-wrap: wrap; gap: 12px; }
.toolbar-right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
@media (max-width: 640px) {
  .filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; }
  .sel select { min-width: 0; }
  .toolbar-right { width: 100%; justify-content: space-between; }
}
.status { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 1.45; color: var(--ink-2); }
.status > span:not(.dot) { flex: 1 1 auto; min-width: 0; }
.status .dot { width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--muted); flex: none; }
.status.live .dot { background: var(--ok); }
.status.error .dot { background: var(--warn); }
.status .link-btn { font-size: 13px; padding: 0; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--rule-soft); border-radius: var(--r-l); padding: 16px 18px 18px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.kpi-label { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.kpi-value { font-size: 34px; font-weight: 600; letter-spacing: -.025em; line-height: 1.05; color: var(--ink); }
.kpi-of { font-size: 20px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.kpi-sub { font-size: 13px; color: var(--ink-2); line-height: 1.4; }
@media (max-width: 480px) { .kpi { padding: 14px; } .kpi-value { font-size: 28px; } }

/* heatmap */
.hm-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-inline: -4px; padding: 2px 4px 6px; }
.hm-scroll:focus-visible { outline-offset: 0; }
.hm { border-collapse: separate; border-spacing: 2px; width: 100%; font-variant-numeric: tabular-nums; }
@media (min-width: 721px) {
  .hm { table-layout: fixed; min-width: 1000px; }
  .hm col.col-fam { width: 236px; }
  .hm col.col-idx { width: 104px; }
}
.hm th, .hm td { padding: 0; }
.hm thead th { font-size: 12px; font-weight: 600; color: var(--ink-2); text-align: center; vertical-align: bottom; padding: 0 3px 8px; line-height: 1.25; }
.hm-code { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-weight: 500; margin-bottom: 3px; }
.hm thead .hm-fam-h { text-align: left; padding-left: 0; }
.hm tbody th, .hm tfoot th { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; font-weight: 500; padding: 6px 14px 6px 0; min-width: 200px; max-width: 250px; vertical-align: middle; line-height: 1.3; }
.hm thead th { overflow-wrap: break-word; }
.hm thead .hm-name { display: block; font-size: 11.5px; }
.fam-link { color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }
.fam-link:hover { color: var(--accent-strong); text-decoration: underline; }
.fam-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; margin-top: 3px; font-size: 11.5px; color: var(--muted); font-weight: 500; }
.fam-meta .tag { height: 18px; font-size: 10.5px; padding: 0 5px; }
.hm td.c { height: 44px; min-width: 60px; text-align: center; font-size: 14px; font-weight: 600; border-radius: var(--r-s); }
.hm tbody tr { cursor: pointer; }
.hm tbody tr:hover th { background: var(--fill); }
.hm tbody tr:hover .fam-link { text-decoration: underline; }
.hm td.c:hover { box-shadow: inset 0 0 0 2px var(--ink); }
.hm td.c.na { background: var(--fill); color: var(--muted); font-weight: 500; }
.hm .idx { min-width: 92px; padding: 0 0 0 12px; text-align: left; vertical-align: middle; }
.hm thead .hm-ih { text-align: left; padding-left: 12px; }
.idx-val { font-weight: 600; font-size: 14px; }
.idx-bar { display: block; height: 4px; width: 64px; background: var(--fill); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.idx-bar i { display: block; height: 100%; background: var(--accent); border-radius: 0 2px 2px 0; }
.th-btn { background: none; border: 0; padding: 4px 0; cursor: pointer; font: 600 12px var(--font-body); color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; }
.th-btn:hover { color: var(--ink); }
.sort-ind { font-size: 11px; color: var(--muted); }
.hm-gap td { height: 6px; }
.hm tfoot th { font-weight: 700; font-size: 13.5px; border-top: 1px solid var(--rule); }
.hm tfoot td.c { font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--ink); }
.hm tfoot .idx-val { font-weight: 700; }
.hm-key { display: none; list-style: none; margin: 0; padding: 0; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
.hm-key b { font-family: var(--font-mono); font-weight: 500; color: var(--muted); margin-right: 6px; }
@media (max-width: 720px) {
  .hm .hm-name { display: none; }
  .hm thead th { padding-bottom: 6px; }
  .hm tbody th, .hm tfoot th { min-width: 132px; max-width: 150px; padding-right: 10px; }
  .fam-link { font-size: 13px; }
  .hm td.c { min-width: 42px; height: 42px; font-size: 13px; }
  .hm .idx { min-width: 72px; padding-left: 8px; }
  .idx-bar { width: 48px; }
  .hm-key { display: grid; }
  .fam-meta { font-size: 11px; gap: 0 4px; margin-top: 2px; }
  .fam-meta .tag { height: auto; padding: 0; border: 0; background: none; font-size: 11px; }
}
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.legend-t { font-weight: 600; color: var(--ink); }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend .lvl-chip { min-width: 24px; height: 20px; font-size: 12px; }
.scroll-hint { display: none; font-size: 12px; color: var(--muted); }
@media (max-width: 1100px) { .scroll-hint { display: block; } }

.pf-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px; align-items: start; }
@media (max-width: 1060px) { .pf-grid { grid-template-columns: minmax(0, 1fr); } }

/* horizontal bars (shared by portfolio and product views) */
.hbar { display: grid; gap: 0; min-width: 0; }
.hbar-row, .hbar-axis, .hbar-head { display: grid; grid-template-columns: minmax(0, 9.5em) minmax(0, 1fr) 3.2em; column-gap: 12px; align-items: center; }
.hbar-name { font-size: 13px; color: var(--ink-2); line-height: 1.25; padding-block: 2px; overflow-wrap: anywhere; }
.hbar-track { position: relative; height: 34px; background-image: linear-gradient(to right, var(--rule-soft) 1px, transparent 1px); background-size: 25% 100%; border-right: 1px solid var(--rule-soft); }
.hbar-track.lv { background-size: 25% 100%; }
.hbar-fill { position: absolute; left: 0; top: 9px; height: 16px; background: var(--accent); border-radius: 0 3px 3px 0; }
.hbar-fill.weak { background: var(--signal); }
.hbar-val { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); }
.hbar-ref { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px solid var(--ink-2); }
.hbar-tgt { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--accent-strong); }
.hbar-port { position: absolute; top: 5px; height: 24px; width: 0; border-left: 2.5px solid var(--ink); margin-left: -1px; }
.hbar-head { margin-bottom: 4px; }
.hbar-head .hh-plot { position: relative; height: 18px; }
.hbar-head .hh-label { position: absolute; bottom: 0; transform: translateX(-50%); font-size: 11.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.hbar-head .hh-label.r { transform: translateX(-100%); }
.hbar-head .hh-label.l { transform: none; }
.hbar-axis .ticks { position: relative; height: 18px; }
.hbar-axis .ticks span { position: absolute; top: 4px; transform: translateX(-50%); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hbar-axis .ticks span:first-child { transform: none; }
.hbar-axis .ticks span:last-child { transform: translateX(-100%); }
.hbar-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); }
.hbar-legend span { display: inline-flex; align-items: center; gap: 6px; }
.k-bar { width: 14px; height: 10px; border-radius: 0 2px 2px 0; background: var(--accent); display: inline-block; }
.k-port { width: 0; height: 14px; border-left: 2.5px solid var(--ink); display: inline-block; }
.k-tgt { width: 0; height: 14px; border-left: 2px solid var(--accent-strong); display: inline-block; }
.k-ref { width: 0; height: 14px; border-left: 1.5px solid var(--ink-2); display: inline-block; }
@media (max-width: 480px) {
  .hbar-row, .hbar-axis, .hbar-head { grid-template-columns: minmax(0, 7.4em) minmax(0, 1fr) 2.9em; column-gap: 8px; }
  .hbar-name { font-size: 12.5px; }
  .hbar-axis .ticks span.minor { display: none; }
}

/* weakest questions and priority actions */
.wq, .actions { list-style: none; margin: 0; padding: 0; display: grid; }
.wq-item, .action { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 6px 14px; padding: 16px 0; border-top: 1px solid var(--rule-soft); align-items: start; }
.wq-item:first-child, .action:first-child { border-top: 0; padding-top: 4px; }
.rank { font-family: var(--font-display); font-size: 20px; font-weight: 600; color: var(--accent-ink); line-height: 1.2; font-variant-numeric: tabular-nums; }
.wq-q, .a-q { font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
.wq-a, .a-text { font-size: 14.5px; font-weight: 600; color: var(--ink); line-height: 1.45; }
.basis { margin-top: 6px; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.5; color: var(--muted); overflow-wrap: anywhere; }
.q-id { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--accent-ink); margin-right: 8px; }
.wq-score { display: grid; justify-items: end; gap: 4px; min-width: 70px; }
.wq-val { font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.wq-bar { width: 64px; height: 4px; background: var(--fill); border-radius: 2px; overflow: hidden; }
.wq-bar i { display: block; height: 100%; background: var(--signal); }
.wq-cap { font-size: 11px; color: var(--muted); }
.a-level { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.a-level .arrow { color: var(--muted); }
@media (max-width: 640px) {
  .wq-item, .action { grid-template-columns: 26px minmax(0, 1fr); }
  .wq-score, .a-level { grid-column: 2; justify-items: start; }
  .wq-score { grid-template-columns: auto auto auto; align-items: center; gap: 8px; }
}

/* ---------- product result ---------- */
.crumbs { display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--muted); }
.crumbs a { font-weight: 500; }
.prod-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 13.5px; color: var(--ink-2); }
.prod-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.result-grid { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 24px; align-items: stretch; }
@media (max-width: 900px) { .result-grid { grid-template-columns: minmax(0, 1fr); } }
.ring-card { justify-items: center; text-align: center; align-content: center; }
.ring-wrap { position: relative; width: 196px; height: 196px; }
.ring { width: 100%; height: 100%; display: block; }
.ring-track { stroke: var(--fill); }
.ring-arc { stroke: var(--accent); }
.ring-port { stroke: var(--ink); }
.ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; }
.ring-num { font-size: 52px; font-weight: 600; letter-spacing: -.035em; line-height: 1; color: var(--ink); }
.ring-lbl { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.ring-compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; width: 100%; border-top: 1px solid var(--rule-soft); }
.ring-compare div { padding: 12px 6px 0; display: grid; gap: 2px; }
.ring-compare div + div { border-left: 1px solid var(--rule-soft); }
.ring-compare b { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ring-compare span { font-size: 12px; color: var(--muted); }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 16px; border-radius: var(--r-l); background: var(--fill); font-size: 14px; color: var(--ink-2); }
.banner.warn { background: var(--surface); border: 1px solid var(--warn); }
.notes-list { list-style: none; margin: 0; padding: 0; display: grid; }
.notes-list li { display: grid; gap: 4px; padding: 12px 0; border-top: 1px solid var(--rule-soft); }
.notes-list li:first-child { border-top: 0; padding-top: 0; }
.note-text { font-size: 14px; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
.history { list-style: none; margin: 0; padding: 0; display: grid; }
.history li + li { border-top: 1px solid var(--rule-soft); }
.hist-btn { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 8px; margin-inline: -8px; width: calc(100% + 16px); border: 0; border-radius: var(--r-m); background: none; text-align: left; cursor: pointer; color: var(--ink); }
.hist-btn:hover { background: var(--fill); }
.hist-btn[aria-current="true"] { background: var(--accent-soft); }
.hist-main { display: grid; gap: 2px; min-width: 0; }
.hist-when { font-weight: 600; font-size: 14px; }
.hist-who { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.hist-idx { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 15px; }
.fallback { display: grid; gap: 8px; }
.fallback textarea { font-family: var(--font-mono); font-size: 12px; min-height: 180px; }

/* ---------- assessment ---------- */
.assess-ctx { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 14px; color: var(--ink-2); }
.assess-ctx strong { color: var(--ink); }
.progress-line { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; font-size: 13px; color: var(--ink-2); }
.progress-line b { color: var(--ink); font-variant-numeric: tabular-nums; }
.save-state { color: var(--muted); }
.stepper { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.st { appearance: none; background: none; border: 0; padding: 4px 0 2px; width: 100%; text-align: left; cursor: pointer; display: grid; gap: 6px; align-content: start; color: var(--muted); font: 500 11.5px/1.25 var(--font-body); min-height: 44px; border-radius: var(--r-s); }
.st:hover { color: var(--ink); }
.st-bar { display: block; height: 4px; border-radius: 2px; background: var(--rule-soft); overflow: hidden; }
.st-bar i { display: block; height: 100%; background: var(--accent); }
.st-code { font-family: var(--font-mono); font-size: 11px; }
.st-name { display: block; }
.st[aria-current="step"] { color: var(--ink); font-weight: 600; }
.st[aria-current="step"] .st-bar { background: var(--rule); box-shadow: 0 0 0 1px var(--ink-2); }
@media (max-width: 860px) { .st-name { display: none; } .st { text-align: center; } }
.step-head { display: grid; gap: 8px; }
.ds-anchor { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.questions { display: grid; gap: 14px; }
.q { border: 1px solid var(--rule-soft); border-radius: var(--r-l); background: var(--surface); padding: 20px 22px 18px; margin: 0; min-width: 0; }
@media (max-width: 640px) { .q { padding: 16px 14px; } }
.q legend { float: left; width: 100%; padding: 0; margin: 0 0 6px; font-size: 16px; font-weight: 500; line-height: 1.5; color: var(--ink); }
.q legend + * { clear: both; }
.q-basis { margin: 0 0 14px; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.seg { position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--rule); border-radius: var(--r-m); background: var(--surface); }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
.seg label { display: grid; align-content: center; justify-items: center; gap: 1px; min-height: 58px; padding: 6px 2px; cursor: pointer; text-align: center; border-left: 1px solid var(--rule); transition: background-color .12s, color .12s; user-select: none; }
.seg label:first-of-type { border-left: 0; border-radius: var(--r-m) 0 0 var(--r-m); }
.seg label:last-of-type { border-radius: 0 var(--r-m) var(--r-m) 0; }
.seg label b { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.seg label span { font-size: 11.5px; color: var(--muted); line-height: 1.2; }
.seg label:hover { background: var(--fill); }
.seg input:checked + label { background: var(--accent); color: var(--on-accent); }
.seg input:checked + label span { color: var(--on-accent); }
.seg input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 2px; position: relative; z-index: 1; }
@media (max-width: 440px) {
  .seg label { padding-inline: 1px; }
  .seg label span { font-size: 10px; letter-spacing: -.01em; hyphens: manual; }
}
.q-desc { margin-top: 8px; font-size: 13px; color: var(--ink-2); min-height: 1.5em; }
.q-desc b { color: var(--ink); }
.q-more { display: flex; flex-wrap: wrap; gap: 4px 22px; margin-top: 8px; align-items: flex-start; }
.q details { min-width: 0; }
.q summary { cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--link); list-style: none; padding: 4px 0; display: inline-flex; align-items: center; gap: 6px; }
.q summary::-webkit-details-marker { display: none; }
.q summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform .15s; margin-right: 2px; }
.q details[open] summary::before { transform: rotate(45deg); }
.q details p { margin: 2px 0 4px; font-size: 14px; color: var(--ink-2); max-width: 70ch; }
.q-note { display: grid; gap: 6px; margin-top: 10px; }
.q-note label { font-size: 13px; font-weight: 600; }
.q-note textarea { min-height: 88px; font-size: 14px; }
.count { font-size: 12px; color: var(--muted); justify-self: end; font-variant-numeric: tabular-nums; }
.step-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 4px; }
.step-hint { font-size: 13px; color: var(--ink-2); flex: 1 1 200px; text-align: center; }
@media (max-width: 560px) { .step-hint { order: -1; flex-basis: 100%; text-align: left; } .step-nav .btn { flex: 1; } }

.form { display: grid; gap: 30px; max-width: 920px; }
.fs { border: 0; margin: 0; padding: 0; min-width: 0; display: grid; gap: 14px; }
.fs-legend { float: left; width: 100%; padding: 0; margin-bottom: 4px; font-weight: 600; font-size: 15px; }
.fs-legend + * { clear: both; }
.fam-group { display: grid; gap: 8px; }
.fam-group-h { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.fam-options { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.opt { position: relative; min-width: 0; }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
.opt label { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 20px; padding: 11px 16px 11px 44px; border: 1px solid var(--rule); border-radius: var(--r-m); background: var(--surface); cursor: pointer; min-height: 58px; position: relative; }
.fo-main { display: grid; gap: 2px; min-width: 0; }
.opt label:hover { border-color: var(--muted); }
.opt label::before { content: ""; position: absolute; left: 15px; top: 50%; margin-top: -9px; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--muted); background: var(--surface); box-sizing: border-box; }
.opt input:checked + label { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.opt input:checked + label::before { border: 5px solid var(--accent); }
.opt input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 2px; }
.fo-name { font-weight: 600; font-size: 14.5px; line-height: 1.3; overflow-wrap: anywhere; }
.fo-meta { font-size: 12.5px; color: var(--muted); }
.fo-last { font-size: 12.5px; color: var(--ink-2); }
.new-fam { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 14px; padding: 16px; border: 1px solid var(--rule-soft); border-radius: var(--r-l); background: var(--sunken); }
@media (max-width: 720px) { .new-fam { grid-template-columns: minmax(0, 1fr); } }
.field { display: grid; gap: 6px; align-content: start; min-width: 0; }
.field > label, .field .lbl { font-weight: 600; font-size: 14px; }
.field .hint { font-size: 12.5px; color: var(--muted); }
.req, .opt-l { font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 6px; }
.field-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 640px) { .field-row { grid-template-columns: minmax(0, 1fr); } }
.data-note { font-size: 13.5px; color: var(--ink-2); padding: 12px 14px; border-left: 2px solid var(--rule); background: var(--sunken); border-radius: 0 var(--r-m) var(--r-m) 0; max-width: 78ch; }
.form-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.confirm { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 14px; color: var(--ink-2); }

.review-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.review-list li { display: flex; gap: 10px; align-items: baseline; font-size: 14px; }
.submit-panel { display: grid; gap: 14px; padding: 20px 22px; border: 1px solid var(--accent); border-radius: var(--r-l); background: var(--surface); }
.submit-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.submit-msg { font-size: 14px; color: var(--ink-2); }
.submit-msg.bad { color: var(--danger); font-weight: 500; }

/* ---------- method ---------- */
.method-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
@media (max-width: 900px) { .method-grid { grid-template-columns: minmax(0, 1fr); } }
.dl { display: grid; gap: 14px; margin: 0; }
.dl div { display: grid; gap: 3px; }
.dl dt { font-weight: 600; font-size: 14px; }
.dl dd { margin: 0; font-size: 14px; color: var(--ink-2); }
.map { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px; }
@media (max-width: 800px) { .map { grid-template-columns: minmax(0, 1fr); } }
.map-d { padding: 16px 0; border-top: 1px solid var(--rule-soft); display: grid; gap: 8px; min-width: 0; }
.map-d h3 { font-size: 15px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.map-q { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); gap: 8px; font-size: 12.5px; }
.map-q .q-id { margin: 0; }
.map-q span:last-child { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-2); overflow-wrap: anywhere; line-height: 1.5; }
.empty { display: grid; gap: 10px; justify-items: start; padding: 28px 24px; border: 1px solid var(--rule-soft); border-radius: var(--r-l); background: var(--surface); }
.empty-t { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.empty p { color: var(--ink-2); max-width: 60ch; }

const DATA = {"scale":[{"level":0,"name":"Not started","descriptor":"Nothing exists yet."},{"level":1,"name":"Initial","descriptor":"Ad hoc or individual effort; not documented."},{"level":2,"name":"Defined","descriptor":"Documented and partly applied; gaps known."},{"level":3,"name":"Implemented","descriptor":"Applied consistently for this product, with evidence."},{"level":4,"name":"Assured","descriptor":"Measured, independently reviewed and audit-ready."}],"target":3,"indexDefinition":"Mean over questions of min(score, 3) / 3. Level 4 does not offset gaps elsewhere. 100% means every question at level 3 or above.","domains":[{"id":"D1","name":"Governance and accountability","short":"Governance","phrase":"governance","anchors":"Art 13(1); Art 28(4); Annex I Part I(1)","questions":[{"id":"Q1.1","text":"A named executive is accountable for CRA compliance, with written authority to block a release and to sign EU declarations of conformity.","basis":"Art 13(1); Art 28(4)","evidence":"Board or ExCo instrument naming the accountable executive and the DoC signatory","action":"Execute a signing instrument naming the DoC signatory, alternate and scope; write release-blocking authority into the sponsor's mandate."},{"id":"Q1.2","text":"The core CRA roles (compliance lead, product security officer, PSIRT lead) are filled by named people with deputies.","basis":"Art 13; BSI TR-03183-3 s4.3","evidence":"Role descriptions, appointments, deputy chain","action":"Appoint named role holders and deputies; publish the RACI with one accountable person per decision."},{"id":"Q1.3","text":"A written product-risk acceptance rule excludes cost, risk appetite and commercial strategy as reasons to leave risk unaddressed.","basis":"Annex I Part I(1); guidance C(2026) 5252 paras 156-163","evidence":"Risk policy section for the product-risk category; acceptance log","action":"Add a product-risk category to the enterprise risk framework with its own acceptance authority and a non-cost appeal route."},{"id":"Q1.4","text":"A programme board reviews CRA readiness monthly against KPIs drawn from a system of record.","basis":"Good practice; Annex VIII Module H pt 3.2","evidence":"Programme board minutes; KPI pack","action":"Run a monthly programme board with a standing agenda and KPIs read from the system of record."}]},{"id":"D2","name":"Scope, inventory and classification","short":"Scope & class","phrase":"scope and classification","anchors":"Arts 2–3, 7–8 and 18–22; Art 69(2)–(3); Annexes III–IV","questions":[{"id":"Q2.1","text":"Every product, version, variant, companion app and backend is in a register with a recorded scope decision.","basis":"Art 2(1); Art 3(1); guidance paras 11-16","evidence":"Scope register extract; decision records","action":"Build the register from release, commercial and cloud systems, then record a dated scope decision per row."},{"id":"Q2.2","text":"Remote data processing boundaries are mapped per product function using the three-element test.","basis":"Art 3(2); guidance paras 184-205","evidence":"Remote-function map per product","action":"Map every remote function to its service, developer and fallback; classify each as RDPS, component or out of scope."},{"id":"Q2.3","text":"Each product has a documented class (default, Class I, Class II or critical) with a core-functionality rationale.","basis":"Arts 7-8; Annexes III-IV; Implementing Regulation (EU) 2025/2392","evidence":"Classification decision record citing the technical description","action":"Classify on core functionality against the Implementing Regulation's technical descriptions; take legal review on borderline cases."},{"id":"Q2.4","text":"The economic-operator role per market and the legacy status of each product line are recorded.","basis":"Arts 18-22; Art 69(2)-(3)","evidence":"Role-per-market table; legacy flags in the register","action":"Record manufacturer, importer, distributor or representative per market; flag lines still sold after 11 Dec 2027."}]},{"id":"D3","name":"Risk assessment and secure by design","short":"Risk & design","phrase":"risk assessment","anchors":"Art 13(2)–(4); Annex I Part I(2)(b), (j); Annex VII point 3","questions":[{"id":"Q3.1","text":"A documented cybersecurity risk assessment exists for the product or family, covering intended purpose, foreseeable use and expected time in use.","basis":"Art 13(2)-(3); Annex VII point 3","evidence":"Signed risk assessment","action":"Run a TR-03183-1-style assessment on the representative product and sign it off through the second line."},{"id":"Q3.2","text":"The assessment states whether and how each Annex I Part I(2)(a)-(m) item applies, with a justification for every item marked not applicable.","basis":"Art 13(3)-(4); Recital 55","evidence":"Applicability matrix with justifications","action":"Complete the 13-row applicability matrix; no row may be signed with a blank justification."},{"id":"Q3.3","text":"Threat models and data-flow diagrams are maintained and updated on defined triggers, not on a calendar.","basis":"Art 13(3); Annex I Part II(3); guidance paras 238-240","evidence":"Threat model versions with change log","action":"Wire update triggers (security-relevant release, new vulnerability, new threat) into the release and PSIRT processes."},{"id":"Q3.4","text":"Secure-by-default configuration (no default credentials, minimal exposed services, reset to original state) is verified at every release.","basis":"Annex I Part I(2)(b), (j)","evidence":"Default-configuration export; reset test record","action":"Add a secure-default configuration check and a reset test to the release gate."}]},{"id":"D4","name":"Secure development and testing","short":"SDLC & testing","phrase":"secure development","anchors":"Annex I Part I(1)–(2)(a) and Part II(3); Annex VII point 6; Art 3(30)","questions":[{"id":"Q4.1","text":"A documented secure development lifecycle with a release security gate applies to every release.","basis":"Annex I Part I(1); Annex VIII Module H pt 3.2","evidence":"SDLC procedure; release gate records","action":"Define the release security gate and make its signed record a precondition for tagging a release."},{"id":"Q4.2","text":"Every release is checked for known exploitable vulnerabilities against EUVD, NVD and the CISA KEV catalogue before it ships.","basis":"Annex I Part I(2)(a); guidance paras 230-237","evidence":"Scan reports and VEX tied to the release SBOM","action":"Automate a known-exploitable check that blocks the release unless each finding is fixed or carries a VEX justification."},{"id":"Q4.3","text":"Security testing (static analysis, fuzzing, dynamic testing, penetration tests) is risk-driven and evidenced per release.","basis":"Annex I Part II(3); Annex VII point 6","evidence":"Test plan with review log; test reports","action":"Write a threat-driven test plan per product and keep a dated review log showing what was re-tested and why."},{"id":"Q4.4","text":"Each release records a substantial-modification decision using the four-question test.","basis":"Art 3(30); guidance paras 103-124","evidence":"Security-delta assessment on the gate record","action":"Add the four guidance questions to the release gate and route positive answers to a new declaration."}]},{"id":"D5","name":"Supply chain, SBOM and open source","short":"SBOM & supply chain","phrase":"SBOM and supply chain","anchors":"Annex I Part II(1); Art 13(5)–(6), (8); Annex VII point 2(b)","questions":[{"id":"Q5.1","text":"A machine-readable SBOM (CycloneDX 1.6+ or SPDX 3.0.1+) is generated from the shipped artefact for every release.","basis":"Annex I Part II(1); Annex VII point 2(b); BSI TR-03183-2","evidence":"Signed SBOM per release with quality score","action":"Generate SBOMs at build from the artefact, enrich to TR-03183-2 fields, sign and store them with the release."},{"id":"Q5.2","text":"Third-party and open-source components pass a documented due-diligence gate before use.","basis":"Art 13(5); Recital 34; guidance paras 167-173","evidence":"Component intake records","action":"Run an intake gate on every new dependency recording need, maintenance signals, licence, vulnerability history and exit plan."},{"id":"Q5.3","text":"Supplier contracts require vulnerability notification, SBOM delivery and support-period commitments.","basis":"Art 13(5), (8); Art 23","evidence":"Contract clause register","action":"Add the CRA clause pack to master agreements, starting with suppliers of security-relevant components."},{"id":"Q5.4","text":"Vulnerabilities found in components are reported upstream and fixes are shared with maintainers.","basis":"Art 13(6); guidance paras 222-229","evidence":"Upstream report log in PSIRT case files","action":"Give PSIRT or the OSPO ownership of upstream reporting, with a duplicate check and legal pre-clearance for fix sharing."}]},{"id":"D6","name":"Vulnerability handling and disclosure","short":"Vulnerability handling","phrase":"vulnerability handling","anchors":"Annex I Part II(2), (4)–(6); Art 13(7), (13), (17)","questions":[{"id":"Q6.1","text":"A coordinated vulnerability disclosure policy, a security.txt file and a non-automated contact channel are published.","basis":"Annex I Part II(5)-(6); Art 13(17)","evidence":"Published CVD policy URL; security.txt; intake monitoring log","action":"Publish the CVD policy and security.txt, add an anonymous web form and a monitored human channel."},{"id":"Q6.2","text":"A PSIRT triages every report and monitoring hit for severity, reachability and active exploitation.","basis":"Annex I Part II(2); Art 14(1)","evidence":"PSIRT procedure; case files with UTC timestamps","action":"Open a case for every report and hit; record reachability and the exploitation decision in UTC."},{"id":"Q6.3","text":"Fixed vulnerabilities are disclosed in public advisories, machine-readable where appropriate, with VEX for non-affected findings.","basis":"Annex I Part II(4); BSI TR-03183-3","evidence":"Advisory index; CSAF documents; VEX files","action":"Stand up an advisory page and a CSAF provider; publish VEX statements for findings that do not affect the product."},{"id":"Q6.4","text":"Vulnerability case records are retained and response metrics are reported.","basis":"Art 13(7), (13)","evidence":"Quarterly PSIRT metrics; retention rule","action":"Report acknowledgement and fix times quarterly and retain case files for 10 years or the support period."}]},{"id":"D7","name":"Updates and support period","short":"Updates & support","phrase":"updates and support","anchors":"Annex I Part I(2)(c), (f) and Part II(2), (7)–(8); Art 13(8)–(9), (19)","questions":[{"id":"Q7.1","text":"Updates are signed, verified before install, protected against rollback and recoverable after a failed install.","basis":"Annex I Part I(2)(c), (f); Annex I Part II(7)","evidence":"Update design note; acceptance tests","action":"Move signing keys into an HSM, add anti-rollback counters and atomic install with recovery."},{"id":"Q7.2","text":"Security updates install automatically by default where applicable, with user notification and a clear opt-out.","basis":"Annex I Part I(2)(c); Recital 56","evidence":"Default configuration export; Annex II point 8(e) text","action":"Turn automatic security updates on by default, or record the Recital 56 carve-out in the risk assessment."},{"id":"Q7.3","text":"Security fixes can ship separately from feature releases and remain available for at least 10 years.","basis":"Annex I Part II(2), (8); Art 13(9)","evidence":"Maintenance branch policy; update repository retention","action":"Run security-only maintenance branches and an immutable update repository retained for 10 years."},{"id":"Q7.4","text":"A support period is set per product from expected time in use, and the end date is shown at purchase.","basis":"Art 13(8), (19); Annex II point 7","evidence":"Support-period determination record; product page","action":"Determine the support period from expected use time (five years is a floor) and publish the end month and year."}]},{"id":"D8","name":"Article 14 reporting readiness","short":"Art 14 reporting","phrase":"Article 14 reporting","anchors":"Art 14(2)–(4), (7)–(8); Art 69(3)","questions":[{"id":"Q8.1","text":"At least two Assigned Representatives are registered on the ENISA Single Reporting Platform with MFA, and the coordinator CSIRT is decided.","basis":"Art 14(7); ENISA SRP FAQ 9, 18","evidence":"SRP roster; coordinator CSIRT decision record","action":"Register two or more personal EU Logins with MFA and record the main-establishment decision before any incident."},{"id":"Q8.2","text":"Written awareness criteria and a 24/7 on-call chain allow an early warning to be filed within 24 hours, including at weekends.","basis":"Art 14(2)(a), (4)(a); guidance para 213","evidence":"PSIRT runbook; on-call rota; deputy chain","action":"Write the awareness test into the runbook and give the PSIRT lead and deputies authority to file without prior approval."},{"id":"Q8.3","text":"Templates for the 24-hour, 72-hour and final reports and for user notification exist and have been rehearsed.","basis":"Art 14(2)-(4), (8); ENISA SRP glossary","evidence":"Templates; drill records","action":"Draft templates on the SRP glossary fields and run two paper drills a year, one vulnerability and one incident."},{"id":"Q8.4","text":"Legacy and end-of-support products are included in the reportable inventory.","basis":"Art 69(3); guidance para 210","evidence":"Reportable inventory including legacy lines","action":"Add every in-scope product still in use to the reportable inventory, including lines no longer sold or supported."}]},{"id":"D9","name":"Documentation, user information and declaration","short":"Documentation & DoC","phrase":"documentation","anchors":"Art 13(12)–(13), (18)–(19); Arts 28–31; Annexes II, V–VII","questions":[{"id":"Q9.1","text":"An Annex VII technical file exists for each product version and is versioned with releases.","basis":"Art 31; Art 13(12)-(13); Annex VII","evidence":"Technical file index per version","action":"Adopt the 13-part file outline and generate version-linked contents from the release pipeline."},{"id":"Q9.2","text":"Annex II user information, including the support end date and the vulnerability contact, is drafted and ready to publish.","basis":"Art 13(18)-(19); Annex II","evidence":"Annex II document per product","action":"Draft the Annex II document per product family and publish it at a stable, versioned URL."},{"id":"Q9.3","text":"The EU declaration of conformity format, signing authority and CE marking placement are decided.","basis":"Arts 28-30; Annexes V-VI","evidence":"DoC template; signing instrument; CE placement record","action":"Agree the DoC template and languages, the signing instrument and where the CE marking sits for hardware and software."},{"id":"Q9.4","text":"Evidence sits in a system of record with 10-year retention and can answer a reasoned request within 10 working days.","basis":"Art 13(13), (22); Art 64(4)","evidence":"System of record; tested request export","action":"Select a system of record, compute retention per version and test an end-to-end reasoned-request export."}]},{"id":"D10","name":"Conformity assessment and market access","short":"Conformity & access","phrase":"conformity","anchors":"Art 32; Arts 18–20 and 35–43; Annex VIII","questions":[{"id":"Q10.1","text":"The conformity route for the product (Module A, B+C or H) is decided, with a fallback.","basis":"Art 32; Annex VIII","evidence":"Route decision record","action":"Decide the route per family; for Class I, plan third-party assessment until a harmonised standard is cited."},{"id":"Q10.2","text":"Candidate notified bodies are shortlisted and a pre-assessment is contracted where the route needs one.","basis":"Art 32(2)-(3); Arts 35-43","evidence":"Shortlist; pre-assessment contract","action":"Shortlist three candidates, contract pre-assessments with conversion options, and check NANDO at every programme board."},{"id":"Q10.3","text":"A complete Module A internal-control record is kept for the product, even where a notified body will be used.","basis":"Annex VIII Module A","evidence":"Internal-control record with evidence index","action":"Build the Module A record and evidence index now; it is the fallback and the body's application pack."},{"id":"Q10.4","text":"EU representation, importer and distributor duties and marketplace arrangements are settled for each market.","basis":"Arts 18-20; Regulation (EU) 2019/1020 Art 4","evidence":"Representation decision per market; mandates","action":"Confirm the role per market, appoint an authorised representative where useful and brief importers on their checks."}]}],"families":[{"id":"T200","name":"T200 Smart Thermostat","short":"T200","bu":"HBS","cls":"Default","wave":"Wave 1 (pilot)","route":"Module A","annex":"-"},{"id":"SSR","name":"S-Series Room Sensors","short":"S-Series","bu":"HBS","cls":"Default","wave":"Wave 2","route":"Module A","annex":"-"},{"id":"H3","name":"HomeHub H3","short":"HomeHub H3","bu":"HBS","cls":"Default (provisional)","wave":"Wave 2","route":"Module A (B+C if Class I)","annex":"Under legal review vs Annex III Class I item 17 (optional alarm mode)"},{"id":"V1","name":"V1 Video Doorbell","short":"V1","bu":"HBS","cls":"Class I","wave":"Wave 1","route":"Module B+C","annex":"Annex III Class I item 17 (security cameras)"},{"id":"L2","name":"L2 Smart Lock","short":"L2","bu":"HBS","cls":"Class I","wave":"Wave 1","route":"Module B+C","annex":"Annex III Class I item 17 (smart door locks)"},{"id":"IR500","name":"IR-500 Industrial Router","short":"IR-500","bu":"IC","cls":"Class I","wave":"Wave 1","route":"Module H","annex":"Annex III Class I item 12 (routers, modems, switches)"},{"id":"IS300","name":"IS-300 Managed Switch","short":"IS-300","bu":"IC","cls":"Class I","wave":"Wave 1","route":"Module H","annex":"Annex III Class I item 12 (routers, modems, switches)"},{"id":"EG700","name":"EG-700 Edge Gateway","short":"EG-700","bu":"IC","cl /* ================= utilities ================= */
const view = document.getElementById('view');
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function mean(a) { if (!a.length) return 0; let s = 0; for (let i = 0; i < a.length; i++) s += a[i]; return s / a.length; }
/* Rounding matches the programme's other reports: nearest value, exact halves to the even digit
   (IS-300 is exactly 52.5% and reports as 52%). The 1e6 step removes floating-point noise first. */
function roundEven(v) {
  v = Math.round(v * 1e6) / 1e6;
  const f = Math.floor(v);
  if (Math.abs(v - f - 0.5) < 1e-9) return f % 2 === 0 ? f : f + 1;
  return Math.round(v);
}
function pct(x) { return roundEven(x * 100); }
function fmt1(x) { return (roundEven(x * 10) / 10).toFixed(1); }
function fmt2(x) { return (roundEven(x * 100) / 100).toFixed(2); }
function bin(x) { return Math.max(0, Math.min(4, Math.floor(x + 1e-9))); }
function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function numw(n) { return n >= 0 && n <= 10 ? NUMW[n] : String(n); }
function clip(s, n) { return typeof s === 'string' ? s.trim().slice(0, n) : ''; }
function fmtDate(t) { const d = new Date(t); return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtTime(t) { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function clsGroup(c) { return String(c || '').indexOf('Default') === 0 ? 'Default' : (c || 'Not classified'); }
function waveGroup(w) { w = String(w || ''); return w.indexOf('Wave 1') === 0 ? 'Wave 1' : w.indexOf('Wave 2') === 0 ? 'Wave 2' : 'Not assigned'; }
function waveShort(w) { const g = waveGroup(w); return g === 'Wave 1' ? (String(w).indexOf('pilot') > -1 ? 'W1 pilot' : 'W1') : g === 'Wave 2' ? 'W2' : 'No wave'; }
function clsShort(c) { return c === 'Default (provisional)' ? 'Default (prov.)' : (c || 'Not classified'); }
function clsTag(c) { const g = clsGroup(c); return '<span class="tag' + (g === 'Class I' ? ' tag-c1' : (g === 'Class II' || g === 'Critical') ? ' tag-c2' : '') + '">' + esc(c) + '</span>'; }
function daysToFull() { const n = new Date(); return Math.round((FULL_APP - Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())) / 86400000); }
function newId() { return 'a' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
function slug(s) { return String(s || '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48); }
/* Soft hyphens let long words break inside narrow heatmap headers only when they must. */
function softHyphens(s) {
  return String(s).replace('Documentation', 'Documen­tation').replace('Vulnerability', 'Vulner­ability')
    .replace('Conformity', 'Confor­mity').replace('Governance', 'Gover­nance');
}
function hash36(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36); }
function cleanId(s) { return typeof s === 'string' && /^[A-Za-z0-9][A-Za-z0-9-]{0,63}$/.test(s) ? s : null; }

const store = {
  get: function (k) { try { const v = window.localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set: function (k, v) { try { window.localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del: function (k) { try { window.localStorage.removeItem(k); } catch (e) { /* storage unavailable */ } }
};

/* ================= scoring ================= */
function famIndex(ans) { return mean(QIDS.map(function (q) { return Math.min(ans[q], TARGET) / TARGET; })); }
function domLevel(ans, d) { return mean(d.questions.map(function (q) { return ans[q.id]; })); }
function domReady(ans, d) { return mean(d.questions.map(function (q) { return Math.min(ans[q.id], TARGET) / TARGET; })); }
function enrich(rec) {
  rec.index = famIndex(rec.answers);
  rec.dLevel = DOMAINS.map(function (d) { return domLevel(rec.answers, d); });
  rec.dReady = DOMAINS.map(function (d) { return domReady(rec.answers, d); });
  return rec;
}

/* Every record from the shared store is untrusted: validate shape and ranges, clip strings. */
function normalise(id, d) {
  if (!d || typeof d !== 'object') return null;
  const a = d.answers;
  if (!a || typeof a !== 'object') return null;
  const answers = {};
  for (let i = 0; i < QIDS.length; i++) {
    const v = a[QIDS[i]];
    if (typeof v !== 'number' || !Number.isInteger(v) || v < 0 || v > 4) return null;
    answers[QIDS[i]] = v;
  }
  const familyId = cleanId(d.familyId);
  if (!familyId) return null;
  const t = Date.parse(d.submittedAt);
  if (!Number.isFinite(t)) return null;
  const notes = {};
  if (d.notes && typeof d.notes === 'object') {
    QIDS.forEach(function (q) { const n = d.notes[q]; if (typeof n === 'string' && n.trim()) notes[q] = n.slice(0, NOTE_MAX); });
  }
  const known = FAM[familyId];
  return enrich({
    id: String(id),
    familyId: familyId,
    familyName: known ? known.name : (clip(d.familyName, 80) || familyId),
    bu: known ? known.bu : (BU_NAMES[d.bu] ? d.bu : 'Other'),
    cls: known ? known.cls : (CLASSES.indexOf(d.cls) > -1 ? d.cls : 'Not classified'),
    wave: known ? known.wave : 'Not assigned',
    role: clip(d.role, 120) || 'Role not stated',
    respondentName: clip(d.respondentName, 120),
    answers: answers,
    notes: notes,
    time: t,
    sample: d.sample === true,
    by: typeof d.by === 'string' ? d.by : null,
    known: !!known
  });
}

const SAMPLES = FAMILIES.map(function (f) {

function loadDraft() {
  const d = store.get(KEY_DRAFT);
  if (!d || d.v !== 1 || typeof d.answers !== 'object') return null;
  const clean = newDraft(typeof d.familyId === 'string' ? d.familyId : '');
  if (d.newFamily && typeof d.newFamily === 'object') {
    clean.newFamily = { name: clip(d.newFamily.name, 80), bu: BU_NAMES[d.newFamily.bu] ? d.newFamily.bu : '', cls: CLASSES.indexOf(d.newFamily.cls) > -1 ? d.newFamily.cls : '' };
  }
  clean.role = clip(d.role, 120); clean.name = clip(d.name, 120);
  QIDS.forEach(function (q) {
    const v = d.answers[q]; if (Number.isInteger(v) && v >= 0 && v <= 4) clean.answers[q] = v;
    const n = d.notes && d.notes[q]; if (typeof n === 'string' && n) clean.notes[q] = n.slice(0, NOTE_MAX);
  });
  clean.step = Number.isInteger(d.step) && d.step >= 0 && d.step <= 11 ? d.step : 0;
  clean.subId = typeof d.subId === 'string' ? d.subId : null;
  clean.updatedAt = typeof d.updatedAt === 'number' ? d.updatedAt : null;

function allRecords() {

function latestByFamily(recs) {
  const m = new Map();
  recs.forEach(function (r) {
    const cur = m.get(r.familyId);
    if (!cur || r.time > cur.time || (r.time === cur.time && cur.sample && !r.sample)) m.set(r.familyId, r);

    const cur = extra.get(r.familyId);
    if (!cur || r.time > cur.time) extra.set(r.familyId, r);

  extra.forEach(function (r) {
    list.push({ id: r.familyId, name: r.familyName, short: r.familyName, bu: r.bu, cls: r.cls, wave: r.wave, route: '', annex: '', known: false, order: 1000 });

  return list;
}
function findFamily(id) { const l = familyList(); for (let i = 0; i < l.length; i++) if (l[i].id === id) return l[i]; return null; }
function buRank(bu) { const i = BU_ORDER.indexOf(bu); return i < 0 ? 9 : i; }
function portfolioOrder(a, b) {
  return buRank(a.bu) - buRank(b.bu) || a.order - b.order || String(a.name).localeCompare(String(b.name));
}
function passes(f) {
  const F = S.filters;
  return (F.bu === 'all' || f.bu === F.bu) && (F.cls === 'all' || clsGroup(f.cls) === F.cls) && (F.wave === 'all' || waveGroup(f.wave) === F.wave);
}
function computePortfolio(applyFilters) {
  const latest = latestByFamily(allRecords());
  let fams = familyList();
  if (applyFilters) fams = fams.filter(passes);
  let rows = fams.map(function (f) { return { fam: f, rec: latest.get(f.id) || null }; });
  const sort = applyFilters ? S.filters.sort : 'portfolio';
  rows.sort(function (a, b) {
    if (sort !== 'portfolio') {
      if (a.rec && !b.rec) return -1;
      if (!a.rec && b.rec) return 1;
      if (a.rec && b.rec && a.rec.index !== b.rec.index) return sort === 'asc' ? a.rec.index - b.rec.index : b.rec.index - a.rec.index;
    }
    return portfolioOrder(a.fam, b.fam);
  });
  const assessed = rows.filter(function (r) { return r.rec; });
  const P = {
    rows: rows, assessed: assessed, n: assessed.length,
    liveRows: assessed.filter(function (r) { return !r.rec.sample; }).length,
    sampleRows: assessed.filter(function (r) { return r.rec.sample; }).length,
    index: null, dReady: [], dLevel: [], qAvg: [], weakest: []
  };
  if (!P.n) return P;
  P.index = mean(assessed.map(function (r) { return r.rec.index; }));
  P.dReady = DOMAINS.map(function (d, i) { return mean(assessed.map(function (r) { return r.rec.dReady[i]; })); });
  P.dLevel = DOMAINS.map(function (d, i) { return mean(assessed.map(function (r) { return r.rec.dLevel[i]; })); });
  P.qAvg = QUESTIONS.map(function (q) { return { q: q, avg: mean(assessed.map(function (r) { return r.rec.answers[q.id]; })) }; });
  P.weakest = P.qAvg.slice().sort(function (a, b) { return a.avg - b.avg || a.q.order - b.q.order; }).slice(0, 10);
  return P;
}
function rankDomains(vals) {
  return DOMAINS.map(function (d, i) { return { d: d, i: i, v: vals[i] }; }).sort(function (a, b) { return a.v - b.v || a.i - b.i; });
}
function priorities(rec) {
  return QUESTIONS.map(function (q) { return { q: q, score: rec.answers[q.id], dl: rec.dLevel[q.di] }; })
    .sort(function (a, b) { return a.score - b.score || a.dl - b.dl || a.q.order - b.q.order; })
    .slice(0, 5);
}
function shortName(f) { return f.short || f.name; }
function sourceLine(P) {
  const parts = [];
  if (P.liveRows) parts.push(P.liveRows + ' submitted ' + (P.liveRows === 1 ? 'assessment' : 'assessments'));
  if (P.sampleRows) parts.push(P.sampleRows + ' illustrative ' + (P.sampleRows === 1 ? 'baseline' : 'baselines') + ' of ' + BASE.date);
  return 'Source: CRA Readiness Diagnostic, latest submission per family (' + parts.join('; ') + '); Illustrative';
}

/* ================= copy for titles and insights ================= */
function classPhrase(g) {
  return g === 'Default' ? 'Default-class products' : g === 'Not classified' ? 'Unclassified products' : g + ' products';
}
function leastReady(P) {
  if (P.n < 2) return '';
  const groups = new Map();
  P.assessed.forEach(function (r) {
    const k = r.fam.bu + '|' + clsGroup(r.fam.cls);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  });
  let best = null;
  if (groups.size > 1) {
    groups.forEach(function (list, k) {
      if (list.length < 2) return;
      const v = mean(list.map(function (r) { return r.rec.index; }));
      if (!best || v < best.v) best = { k: k, list: list, v: v };
    });
  }
  if (best) {
    const parts = best.k.split('|');
    const members = best.list.slice().sort(function (a, b) { return a.rec.index - b.rec.index; })
      .map(function (r) { return shortName(r.fam) + ' ' + pct(r.rec.index) + '%'; }).join(', ');
    return classPhrase(parts[1]) + ' in ' + (BU_NAMES[parts[0]] || 'other units') + ' are least ready at ' + pct(best.v) + '% (' + members + ')';
  }
  const low = P.assessed.slice().sort(function (a, b) { return a.rec.index - b.rec.index; })[0];
  return low.fam.name + ' is least ready at ' + pct(low.rec.index) + '%';
}
function portfolioTitle(P) {
  if (!P.n) return 'No assessments match this view yet.';
  if (P.n === 1) return 'One family assessed so far: readiness is ' + pct(P.index) + '%.';
  const r = rankDomains(P.dReady);
  return 'Readiness is ' + pct(P.index) + '%; ' + r[0].d.phrase + ' and ' + r[1].d.phrase + ' hold the portfolio back.';
}
function insightLine(P) {
  if (!P.n) return '';
  const w = rankDomains(P.dReady)[0];
  const seg = leastReady(P);
  return w.d.short + ' is the weakest domain at ' + pct(w.v) + '%' + (seg ? '; ' + seg : '') + '.';
}
function heatTitle(P) {
  let k = 0;
  P.assessed.forEach(function (r) { r.rec.dLevel.forEach(function (v) { if (bin(v) >= TARGET) k++; }); });
  if (!k) return 'No product family has reached target level 3 in any domain yet.';
  return cap(numw(k)) + ' of ' + (P.n * DOMAINS.length) + ' family–domain scores reach target level 3.';
}
function barsTitle(P) {
  const r = rankDomains(P.dReady);
  const s = r[r.length - 1];
  const below = P.dReady.filter(function (v) { return pct(v) < 40; }).length;
  const tail = below === 0 ? 'every domain is at 40% or above' : below === 1 ? 'one domain sits below 40%' : numw(below) + ' of ten domains sit below 40%';
  return s.d.short + ' leads at ' + pct(s.v) + '%; ' + tail + '.';
}
function weakestTitle(P) {
  const counts = DOMAINS.map(function (d, i) { return { d: d, i: i, c: 0, v: P.dReady[i] }; });
  P.weakest.forEach(function (w) { counts[w.q.di].c++; });
  counts.sort(function (a, b) { return b.c - a.c || a.v - b.v || a.i - b.i; });
  const n = P.weakest.length;
  if (counts[0].c >= 6) return cap(numw(counts[0].c)) + ' of the ' + numw(n) + ' weakest questions concern ' + counts[0].d.phrase + '.';
  if (counts[1].c >= 2 && counts[0].c + counts[1].c >= 5) return cap(numw(counts[0].c + counts[1].c)) + ' of the ' + numw(n) + ' weakest questions concern ' + counts[0].d.phrase + ' and ' + counts[1].d.phrase + '.';
  const spread = counts.filter(function (c) { return c.c > 0; }).length;
  return 'The ' + numw(n) + ' weakest questions spread across ' + numw(spread) + ' domains.';
}
function productTitle(rec, fam, P) {
  const r = rankDomains(rec.dLevel);
  let rel = '';
  if (P.index != null && P.n > 1) {
    const diff = pct(rec.index) - pct(P.index);
    rel = diff === 0 ? ', level with the portfolio' : ', ' + Math.abs(diff) + (Math.abs(diff) === 1 ? ' point ' : ' points ') + (diff > 0 ? 'above' : 'below') + ' the portfolio';
  }
  const gap = r[0].v >= 3 ? 'no domain is below target' : r[0].d.phrase + ' is the largest gap';
  return shortName(fam) + ' is ' + pct(rec.index) + '% ready' + rel + '; ' + gap + '.';
}

function hbarHTML(items, o) {
  const max = o.max;

  let head = '';

  if (o.ref != null) labels.push({ x: pos(o.ref), t: o.refLabel });
  if (o.target != null) labels.push({ x: pos(o.target), t: 'Target ' + o.target });
  if (labels.length) {
    head = '<div class="hbar-head" aria-hidden="true"><span></span><span class="hh-plot">' + labels.map(function (l) {
      const c = l.x > 82 ? ' r' : l.x < 12 ? ' l' : '';
      return '<span class="hh-label' + c + '" style="left:' + l.x.toFixed(2) + '%">' + esc(l.t) + '</span>';
    }).join('') + '</span><span></span></div>';
  }
  const rows = items.map(function (it) {
    return '<div class="hbar-row" data-tip="' + esc(it.tip) + '"><span class="hbar-name">' + esc(it.name) + '</span>' +
      '<span class="hbar-track" aria-hidden="true"><i class="hbar-fill' + (it.weak ? ' weak' : '') + '" style="width:' + pos(it.v).toFixed(2) + '%"></i>' +
      (o.ref != null ? '<span class="hbar-ref" style="left:' + pos(o.ref).toFixed(2) + '%"></span>' : '') +
      (o.target != null ? '<span class="hbar-tgt" style="left:' + pos(o.target).toFixed(2) + '%"></span>' : '') +
      (it.port != null ? '<span class="hbar-port" style="left:' + pos(it.port).toFixed(2) + '%"></span>' : '') +
      '</span><span class="hbar-val">' + esc(o.fmt(it.v)) + '</span></div>';
  }).join('');
  const ticks = '<div class="hbar-axis" aria-hidden="true"><span></span><span class="ticks">' + o.ticks.map(function (t, i) {
    const minor = o.minorTicks && i % 2 === 1;
    return '<span' + (minor ? ' class="minor"' : '') + ' style="left:' + pos(t).toFixed(2) + '%">' + esc(o.tickFmt(t)) + '</span>';
  }).join('') + '</span><span></span></div>';
  return '<div class="hbar" role="img" aria-label="' + esc(o.aria) + '">' + head + rows + ticks + '</div>';
}

function renderPortfolio() {
  const fams = familyList();
  const bus = [['all', 'All units']].concat(BU_ORDER.map(function (b) { return [b, b + ' · ' + BU_NAMES[b]]; }));
  if (fams.some(function (f) { return BU_ORDER.indexOf(f.bu) < 0; })) bus.push(['Other', 'Other']);
  const clsVals = [['all', 'All classes'], ['Default', 'Default'], ['Class I', 'Class I'], ['Class II', 'Class II']];
  if (fams.some(function (f) { return clsGroup(f.cls) === 'Critical'; })) clsVals.push(['Critical', 'Critical']);
  if (fams.some(function (f) { return clsGroup(f.cls) === 'Not classified'; })) clsVals.push(['Not classified', 'Not classified']);
  const waves = [['all', 'All waves'], ['Wave 1', 'Wave 1'], ['Wave 2', 'Wave 2']];
  if (fams.some(function (f) { return waveGroup(f.wave) === 'Not assigned'; })) waves.push(['Not assigned', 'Not assigned']);
  const sorts = [['portfolio', 'Portfolio order'], ['asc', 'Readiness, lowest first'], ['desc', 'Readiness, highest first']];
  view.innerHTML =
    '<header class="view-head">' +
      '<p class="tracker">Portfolio · latest submission per product family</p>' +
      '<h1 class="title" id="view-title" tabindex="-1"></h1>' +
      '<p class="insight" id="pf-insight"></p>' +
    '</header>' +
    '<div class="stack">' +
      '<div class="toolbar">' +
        '<div class="filters" role="group" aria-label="Filter the portfolio">' +
          '<label class="sel" for="f-bu">Business unit<span class="sel-box"><select id="f-bu" data-filter="bu">' + optionList(bus, S.filters.bu) + '</select></span></label>' +
          '<label class="sel" for="f-cls">CRA class<span class="sel-box"><select id="f-cls" data-filter="cls">' + optionList(clsVals, S.filters.cls) + '</select></span></label>' +
          '<label class="sel" for="f-wave">Wave<span class="sel-box"><select id="f-wave" data-filter="wave">' + optionList(waves, S.filters.wave) + '</select></span></label>' +
          '<label class="sel" for="f-sort">Sort<span class="sel-box"><select id="f-sort" data-filter="sort">' + optionList(sorts, S.filters.sort) + '</select></span></label>' +
        '</div>' +
        '<div class="toolbar-right">' +
          '<label class="switch" for="f-samples"><input type="checkbox" id="f-samples" role="switch"' + (S.includeSamples ? ' checked' : '') + '>Include illustrative sample data</label>' +
          '<button type="button" class="btn btn-secondary btn-s" data-act="export">Export CSV</button>' +
        '</div>' +
      '</div>' +
      statusHTML() +
      '<div class="fallback" id="export-fallback" hidden></div>' +
      '<div id="pf-content" class="stack"></div>' +
    '</div>';
  renderPortfolioContent();
}

    host.innerHTML = '<div class="empty"><p class="empty-t">' + (filtered ? 'Nothing to show for these filters' : 'No submissions yet') + '</p>' +

    return { name: it.d.short, v: it.v, weak: it.i === w.i, tip: it.d.name + '|Readiness ' + pct(it.v) + '% · average level ' + fmt2(P.dLevel[it.i]) + ' of 4' };
  });
  const bars = hbarHTML(items, {
