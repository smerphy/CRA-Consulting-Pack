<!-- @dsCard group="Brand" height=220 subtitle="Reserved space for the client's own logo; dashed until a real file is supplied" -->
<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><title>Client logo slot</title></head>
<body>
<div class="adv-stage">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: 0 0 var(--space-4); border-bottom: var(--border-hairline) solid var(--rule);">
    <span class="adv-wordmark">Advisory</span>
    <span class="adv-logo-slot" role="img" aria-label="Client logo placeholder">Client logo</span>
  </div>
  <div class="adv-row adv-row--top" style="gap: var(--space-6);">
    <div style="display: flex; flex-direction: column; gap: var(--space-2);">
      <span class="adv-logo-slot" role="img" aria-label="Client logo placeholder, 160 by 48">Client logo</span>
      <span class="source-line adv-spec">Web header · 160 × 48</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: var(--space-2);">
      <span class="adv-logo-slot adv-logo-slot--lg" role="img" aria-label="Client logo placeholder, 240 by 72">Client logo</span>
      <span class="source-line adv-spec">Document cover · 240 × 72 (slides: 320 × 96)</span>
    </div>
  </div>
</div>
</body>
</html>
