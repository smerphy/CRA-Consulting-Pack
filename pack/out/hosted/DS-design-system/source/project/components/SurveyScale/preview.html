<!-- @dsCard group="Web patterns" height=300 subtitle="The 0-4 maturity question: segmented radio scale, N/A and Don't know, level descriptor" -->
<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><title>Survey scale</title></head>
<body>
<div class="adv-stage" style="max-width: 820px;">
  <fieldset class="adv-scale">
    <legend class="adv-scale__q"><span class="id">Q10.2</span>Candidate notified bodies are shortlisted and a pre-assessment is contracted where the route needs one.</legend>
    <div class="adv-scale__options">
      <label class="adv-scale__opt"><input type="radio" name="q10-2" value="0"><span class="adv-scale__n">0</span><span class="adv-scale__name">Not started</span></label>
      <label class="adv-scale__opt"><input type="radio" name="q10-2" value="1"><span class="adv-scale__n">1</span><span class="adv-scale__name">Initial</span></label>
      <label class="adv-scale__opt"><input type="radio" name="q10-2" value="2" checked><span class="adv-scale__n">2</span><span class="adv-scale__name">Defined</span></label>
      <label class="adv-scale__opt"><input type="radio" name="q10-2" value="3"><span class="adv-scale__n">3</span><span class="adv-scale__name">Implemented</span></label>
      <label class="adv-scale__opt"><input type="radio" name="q10-2" value="4"><span class="adv-scale__n">4</span><span class="adv-scale__name">Assured</span></label>
    </div>
    <div class="adv-scale__extra">
      <label class="adv-scale__alt"><input type="radio" name="q10-2" value="na">Not applicable</label>
      <label class="adv-scale__alt"><input type="radio" name="q10-2" value="dk">Don’t know</label>
    </div>
    <p class="adv-scale__desc"><b>2 · Defined:</b> documented and partly applied; gaps known. Target for every question is 3.</p>
  </fieldset>
</div>
</body>
</html>
