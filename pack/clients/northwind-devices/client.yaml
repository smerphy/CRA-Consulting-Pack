storyline:
  governing_thought: The CRA makes product cybersecurity a condition of selling in the EU. Northwind Devices can be ready by 11 Dec 2027, but only if it books third-party assessment for its smart meter gateway and building-network products and builds shared compliance tooling by mid-2027.
  scqa:
    situation: The Cyber Resilience Act (Regulation (EU) 2024/2847) has applied to manufacturers' vulnerability and incident reporting since 11 Sep 2026, for every in-scope product already on the market. All other obligations apply from 11 Dec 2027.
    complication: 'Four of Northwind Devices'' six product families need a notified body, including the KS-1 Smart Meter Gateway, an Annex IV critical product; no CRA notified body or harmonised standard exists yet; and the Energy Systems business has no PSIRT of its own.'
    question: What must Northwind Devices do, by when and at what cost, to keep selling its gateways, chargers and building-network products in the EU after 11 Dec 2027?
    answer: 'Run a 13-month, two-wave programme (Project Keystone): stand up one PSIRT and SBOM pipeline for both business units, take the five notified-body families through assessment first, and contract notified-body capacity by Q1 2027. Investment is about __ONEOFF__ to Dec 2027 and __RUN__ a year to run. The board is asked to take four decisions on 10 Dec 2026.'
  pillars:
  - title: Reporting already applies
    message: Every in-scope product, including the KS-0 gateways still in the field, is on a 24-hour reporting clock today.
    proof: Art 14 applies since 11 Sep 2026 (Art 69(3)); early warning 24h, notification 72h, final report 14 days / 1 month.
  - title: Third-party assessment is the bottleneck
    message: __EUNB__ of annual EU revenue sits in Class I, Class II and critical products that need a notified body that does not yet exist.
    proof: No harmonised standard cited; no CRA notified body designated at checks to 8 Sep 2026; no Art 8(1) certification act adopted for critical products.
  - title: One evidence system for both businesses
    message: Build the PSIRT, SBOM and technical-file tooling once and use it for meters, chargers and network products alike.
    proof: Annex VII file per version; retention 10 years or support period (Art 13(13)); PLD disclosure from 9 Dec 2026.
