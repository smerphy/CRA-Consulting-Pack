# CRA readiness pack — client intake (Northwind Devices, fictional demo client)
# Demonstrates the re-skin pipeline on a second, smaller client: two business units, six product families
# covering default, Class I, Class II and one critical (Annex IV) product.
# Build: python3 pack/reskin.py pack/clients/northwind-devices/client.yaml

