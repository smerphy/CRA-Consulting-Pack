storyline:
  governing_thought: The CRA turns product cybersecurity into a licence to sell in the EU. Example Group can be ready by 11 Dec 2027, but only if it secures third-party assessment capacity and builds shared compliance infrastructure in the next two quarters.
  scqa:
    situation: The Cyber Resilience Act (Regulation (EU) 2024/2847) has been in force since 10 Dec 2024. Article 14 reporting has applied since 11 Sep 2026 to every in-scope product, including those already sold. Everything else applies from 11 Dec 2027.
    complication: 'Three things make this harder than a normal compliance project: reporting is already live on a 24-hour clock; seven of Example Group''s thirteen product families need a notified body or a cited harmonised standard, and neither exists today; and compliance must be proven with evidence for every product version for at least ten years.'
    question: What must Example Group do, by when and at what cost to keep selling in the EU after 11 Dec 2027?
    answer: 'Run a 14-month, three-wave programme (Project Rampart): build shared capabilities once (PSIRT, SBOM, secure updates, evidence system), apply them product by product, and lock in notified-body capacity by Q1 2027. Investment is about __ONEOFF__ to Dec 2027 and __RUN__ a year to run. The board is asked to take five decisions on 19 Nov 2026.'
  pillars:
  - title: Reporting is already law
    message: Every in-scope product — legacy included — is on a 24-hour reporting clock today.
    proof: Art 14 applies since 11 Sep 2026 (Art 69(3)); early warning 24h, notification 72h, final report 14 days / 1 month.
  - title: Market access is the binding constraint
    message: __EUNB__ of annual EU revenue sits in Class I and II products that need a notified body that does not yet exist.
    proof: No harmonised standard cited; no CRA notified body designated at checks to 8 Sep 2026; vendor estimates of 12-18 months per body.
  - title: Compliance is an evidence system, not a project
    message: Build once, apply per product version, sustain for ten years.
    proof: Annex VII file per version; retention 10 years or support period (Art 13(13)); PLD disclosure from 9 Dec 2026.
