  decisions:
    steerco_1:
    - id: SD1
      decision: Endorse Module H as the route for Industrial Connectivity and FleetView (five families), using the IEC 62443-4-1 process as the base.
      outcome: Endorsed (illustrative)
    - id: SD2
      decision: 'Apply the stricter reading to EG-700 and HomeHub H3 until the legal opinion lands on 27 Nov 2026: include them in notified-body capacity planning, keep them in Wave 2 for remediation.'
      outcome: Endorsed (illustrative)
    - id: SD3
      decision: Release EUR 0.75m of pre-approval spend ahead of the 19 Nov board.
      outcome: Endorsed (illustrative)
    - id: SD4
      decision: Approve system-of-record selection criteria.
      outcome: Endorsed (illustrative)
    board:
    - id: BD1
      decision: Approve the Project Rampart investment envelope.
      detail: EUR {{one_off_m}}m one-off to Dec 2027 (incl. {{contingency_pct}}% contingency) and EUR {{run_m}}m a year run from 2028.
    - id: BD2
      decision: Appoint the accountable executive and execute the DoC signing instrument.
      detail: CTO as accountable executive; CEO signs declarations or delegates in writing; compliance lead counter-signs the pre-signature checklist.
    - id: BD3
      decision: Authorise notified-body pre-contracting.
      detail: Pre-assessments with three candidate bodies (up to EUR 60k) and formal contracts by Q1 2027 (Module H for IC + FleetView; Module B+C for V1 and L2).
    - id: BD4
      decision: Adopt the product-risk acceptance rule.
      detail: Cost, risk appetite and commercial strategy are not grounds to leave product risk unaddressed (guidance paras 156-163); appeals go to the executive sponsor.
    - id: BD5
      decision: Withdraw IR-300 and IS-200 from EU sale before 11 Dec 2027.
      detail: EUR 18m of declining EU revenue versus about EUR 1.4m remediation plus notified-body fees; migrate customers to IR-500 and IS-300.
