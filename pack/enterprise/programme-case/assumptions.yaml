# Aldermoor Platforms: CRA integrated programme case (module E7). Assumptions register.
#
# Format: a flat list of mappings (a strict subset of YAML read by model.py's own parser, so the
# model needs only the Python standard library). One item per input. Fields:
#   section  global | cost | nb | lever | line | activity
#   key      identifier used by model.py and as a defined name in the Excel workbook
#   low/base/high  values. For COST inputs, low = cheaper. For SCHEDULE inputs (activities and the
#            nb section), low = the favourable end (earlier or faster), so "Low" is the optimistic
#            scenario throughout; nb_assessors is therefore listed high-to-low.
#   source   the module file the value comes from, or "assumption"
#   label    module | module (range assumption) | assumption | external
# Inputs marked "from:" are overwritten at run time by the value in that module output file;
# the numbers written here are the fallback if the file is missing (model.py says so in its log).
# Days are calendar days from the programme start date (2 Nov 2026). Quarters run Q4 2026 to Q4 2028;
# Q4 2026 covers Nov-Dec only, which the 2026Q4 profile factors reflect.

# ---------------------------------------------------------------- global
- section: global
  key: usd_to_eur
  desc: Conversion from USD to EUR
  low: 0.919
  base: 0.919
  high: 0.919
  unit: EUR per USD
  source: BRIEF.md (revenue USD 310bn = about EUR 285bn)
  label: module
- section: global
  key: jpy_per_eur
  desc: Conversion from EUR to JPY for JC-STAR fees
  low: 170
  base: 170
  high: 170
  unit: JPY per EUR
  source: assumption (not a quoted rate)
  label: assumption
- section: global
  key: productive_hours
  desc: Productive hours per FTE-year
  low: 1600
  base: 1600
  high: 1600
  unit: hours
  source: art14-operations/volume_model.csv (productive_hours_fte)
  label: module
- section: global
  key: engineers_total
  desc: Engineers in the group (for awareness training memo)
  low: 60000
  base: 60000
  high: 60000
  unit: people
  source: BRIEF.md
  label: module

