  - id: F10
    name: Aldermoor One VPN
    line: Consumer apps
    org: cloud_apps
    core_functionality: "Consumer VPN client creating encrypted tunnels to Aldermoor gateways"
    ancillary: []
    placement: placed
    category: I5
    foss_qualifying: false
    monetisation: "Included in the paid Aldermoor One subscription"
    eu_revenue: {est_eur_m: 120, basis: "share of subscription revenue"}
    release: {cadence: "Monthly releases", versions_per_year: 12, initial_types: 3, new_types_per_year: 0, substantial_mods_per_year: 1, complexity: 0.8}
    rdps: ["VPN gateway fleet", "Subscription entitlement service"]
    separately_sold_modules: ["Sold as part of the Aldermoor One bundle but installed and licensed as its own app: classify on its own core (guidance pt 145)"]
    integrated_components: []
    rationale: "VPN clients are named in the I.5 description. Separately licensed inside a bundle, it is its own product (guidance pt 145)."
    citations: ["IR 2025/2392 Annex I item 5", "Guidance pt 145, Example 61"]
    borderline: {level: low, note: "Clear.", alternative: "None"}

  # ---------------- Lumen ----------------
  - id: F11
    name: Lumen Browser (desktop)
    line: Lumen
    org: lumen
    core_functionality: "Accessing and rendering web content"
    ancillary: ["Built-in password manager", "Sync", "AI agent features", "Secure DNS"]
    placement: placed
    category: I2
    foss_qualifying: false
    monetisation: "Free; monetised through search and services"
    eu_revenue: {est_eur_m: 4200, basis: "enabled: search and services revenue"}
    release: {cadence: "New major every 4 weeks; weekly security updates", versions_per_year: 65, initial_types: 1, new_types_per_year: 0, substantial_mods_per_year: 3, complexity: 3}
    rdps: ["Sync service", "Safe-browsing lookup service", "Update service", "AI agent backend"]
    separately_sold_modules: []
    integrated_components: ["Lumen Engine (open source, Aldermoor-stewarded)"]
    rationale: >-
      Standalone browser; the I.2 description expressly includes browsers with AI-agent integration. The built-in password
      manager is ancillary and neither declassifies nor adds a class (one core functionality, guidance pt 144). Free supply
      monetised through search is a commercial activity (Art 3(22); guidance pt 54). The shipped build contains proprietary
      code, so it does not qualify as FOSS and Art 32(5) is not available as shipped.
    citations: ["IR 2025/2392 Annex I item 2", "Guidance pts 144, 54", "Art 3(22)", "Art 32(5)", "10-conformity.md"]
    borderline: {level: medium, note: "Not a class question. The route question is whether a fully FOSS-qualifying build could use Art 32(5); see paper. Each 4-weekly major must pass the substantial-modification test (pt 110); AI-agent features are the likeliest substantial changes.", alternative: "Art 32(5) Module A with public technical documentation, only if the client build qualifies as FOSS"}

  - id: F12
    name: Lumen Browser (mobile)
    line: Lumen
    org: lumen
    core_functionality: "Accessing and rendering web content on mobile devices"
    ancillary: ["Password manager", "Sync", "AI agent features"]
    placement: placed
    category: I2
    foss_qualifying: false
    monetisation: "Free; monetised through search and services"
    eu_revenue: {est_eur_m: 3600, basis: "enabled: search and services revenue"}
    release: {cadence: "New major every 4 weeks; weekly security updates", versions_per_year: 65, initial_types: 2, new_types_per_year: 0, substantial_mods_per_year: 3, complexity: 3}
    rdps: ["Sync service", "Safe-browsing lookup service", "AI agent backend"]
    separately_sold_modules: []
    integrated_components: ["Lumen Engine"]
    rationale: >-
      As F11. Pre-installation on Arc phones does not change this: the same browser is separately downloadable and separately
      updated on other platforms, so it is placed on the market in its own right.
    citations: ["IR 2025/2392 Annex I item 2", "Art 3(21)", "Guidance paras 13-14"]
    borderline: {level: low, note: "As F11.", alternative: "As F11"}

  - id: F13
    name: Lumen WebView (system embedded browser component)
    line: Lumen
    org: lumen
    core_functionality: "Embedded web-content rendering component used by third-party apps"
    ancillary: []
    placement: placed
    category: I2
    foss_qualifying: false
    monetisation: "Free; distributed through the app store to Halo devices, including third-party OEM devices"
    eu_revenue: {est_eur_m: 0, basis: "not attributable"}
    release: {cadence: "Follows Lumen Browser: 4-weekly majors, weekly security updates", versions_per_year: 65, initial_types: 1, new_types_per_year: 0, substantial_mods_per_year: 2, complexity: 2.5}
    rdps: ["Update service", "Safe-browsing lookup service"]
    separately_sold_modules: []
    integrated_components: ["Lumen Engine"]
    rationale: >-
      The I.2 category is "standalone and embedded browsers" and the description includes embedded webview engines. Because the
      component is supplied and updated separately to devices Aldermoor does not manufacture, it is a component placed on the
      market (Art 3(1)), not merely an integrated part of an Arc device.
    citations: ["IR 2025/2392 Annex I item 2", "Art 3(1)", "06-classification.md Table A"]
    borderline: {level: high, note: "On Arc devices alone it would be integrated (no separate class). Distribution to third-party OEM devices makes it a separately placed component. Counsel to confirm.", alternative: "Integrated component of F06 or of OEM devices (no separate class)"}

  - id: F14
    name: Lumen OS (OEM images and Lumen OS Flex)
    line: Lumen
    org: platforms
    core_functionality: "Laptop operating system supplied as complete images to OEMs and as a download for existing PCs"
    ancillary: ["Verified boot", "Built-in Lumen Browser", "Device management client"]
    placement: placed
    category: I11
    foss_qualifying: false
    monetisation: "OEM licence fees; Flex enterprise licences"
    eu_revenue: {est_eur_m: 900, basis: "licence fees and attributable services"}
    release: {cadence: "Automatic update every 4 weeks; weekly security fixes", versions_per_year: 30, initial_types: 2, new_types_per_year: 0.5, substantial_mods_per_year: 2, complexity: 4}
    rdps: ["Update service", "Device enrolment and policy service", "Account sign-in"]
    separately_sold_modules: []
    integrated_components: ["Lumen Browser", "boot manager"]
    rationale: >-
      Supplied separately from Aldermoor hardware, so it is its own product (guidance para 25, Example 8). Core functionality
      matches I.11. The bundled browser and boot manager are ancillary and do not change the class (IR recitals: an OS with
      ancillary tools is still an OS).
    citations: ["IR 2025/2392 Annex I item 11", "Guidance para 25, Example 8", "IR 2025/2392 recitals"]
    borderline: {level: low, note: "Clear.", alternative: "None"}

