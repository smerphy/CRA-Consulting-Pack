# Aldermoor Platforms: EU-sold portfolio at product-family level (module E3)
# Fictional reference client. All revenue figures, type counts and cadences are
# ILLUSTRATIVE ESTIMATES made for this exercise, not data about any real company.
# Legal rules applied by classify.py are taken from the knowledge base:
#   reports/sections/03-scope.md, 05-roles.md, 06-classification.md,
#   10-conformity.md, 12-open-source.md and reports/verification.md.

meta:
  client: Aldermoor Platforms (fictional)
  as_at: "2026-11-01"
  regulatory_facts_verified_to: "2026-10-30"
  notified_body_status_checked_to: "2026-09-08"
  eu_revenue_total_eur_m: 77000   # 27% of EUR 285bn group revenue (brief)
  revenue_note: >-
    eu_revenue.est_eur_m is an illustrative estimate of EU revenue attributable to
    the family. For hardware and paid software it is product revenue. For free
    clients (browser, consumer apps, Halo Services) it is the services revenue for
    which the client is the main channel ("enabled" basis). Bands are labels only.
  revenue_bands_eur_m:
    - {label: "nil or not attributable", max: 0}
    - {label: "< 100", max: 100}
    - {label: "100-500", max: 500}
    - {label: "500-1,000", max: 1000}
    - {label: "1,000-5,000", max: 5000}
    - {label: "> 5,000", max: 999999}
  additions_to_brief:
    # Details added by the E3/E4 writer, consistent with the master brief.
    - "Aldermoor sells laptops (Arc Book) running Lumen OS; the brief implies them via Bastion in laptops."
    - "Halo is licensed to third-party phone makers as open-source base (HOSP, free) plus a separately licensed proprietary Halo Services package."
    - "Halo Wear: complete Halo-based OS images supplied to third-party watchmakers (small programme)."
    - "Lumen OS is supplied as complete images to third-party laptop OEMs and as a downloadable edition (Lumen OS Flex) for existing PCs."
    - "Lumen WebView: the Lumen Engine-based system webview, updated through the app store on Halo devices."
    - "Aldermoor Authenticator (OTP/MFA app) and Aldermoor One VPN (consumer VPN in the Aldermoor One subscription)."
    - "Cloud Connect: on-prem connectors (directory sync, storage gateway) and a site-to-site VPN gateway virtual appliance."
    - "Aldermoor Edge: on-prem hybrid platform (hypervisor plus container runtime) installed on customer hardware."
    - "Mooring Enterprise: paid, supported Mooring distribution sold with Aldermoor Edge."
    - "Tensile LTS builds are offered only to paying Aldermoor Cloud customers today (see E4)."
    - "Hearth Aware: paid subscription for camera video history (remote data processing)."

organisations:
  lumen:     {name: "Lumen (browser)", note: "Lumen Browser desktop and mobile, Lumen WebView"}
  platforms: {name: "Platforms (Halo and Lumen OS)", note: "Halo OS, Halo Services, Halo Wear, Lumen OS"}
  devices:   {name: "Devices (Arc, Hearth, Pulse, Keystone)", note: "Hardware and companion apps; contract manufacturing"}
  cloud_apps: {name: "Cloud and apps", note: "Aldermoor Cloud installed products, consumer and enterprise apps"}
  oss:       {name: "Open source programme office", note: "Steward role for the five Aldermoor-led projects (see E4)"}

families:

  # ---------------- Arc devices ----------------
  - id: F01
    name: Arc phones
    line: Arc devices
    org: devices
    core_functionality: "General-purpose smartphone: mobile communications and execution of user applications"
    ancillary: ["Halo OS (integrated)", "Lumen Browser (pre-installed, also separately available)", "built-in password autofill", "Bastion secure element (integrated)"]
    placement: placed
    category: default
    foss_qualifying: false
    monetisation: "Device sale; 7-year support commitment"
    eu_revenue: {est_eur_m: 9500, basis: "device sales"}
    release: {cadence: "Monthly security patches; one major Halo release a year; 2-3 new models a year", versions_per_year: 13, initial_types: 6, new_types_per_year: 3, substantial_mods_per_year: 1, complexity: 1.5}
    rdps: ["Device activation and account sign-in", "Update distribution service", "Backup and sync"]
    separately_sold_modules: ["Aldermoor One VPN subscription (classified separately as F10)"]
    integrated_components: ["Halo OS (Annex III I.11 type function)", "Bastion secure element (Annex IV item 3 type function)"]
    rationale: >-
      Core functionality is a phone, not an operating system. A smartphone integrating an OS is not an OS (guidance Example 58),
      and integrating an important or critical component does not reclassify the host (Art 7(1)); the FAQ also says a smartphone is
      not a password manager. The phone still has to assess the security of Halo OS and Bastion inside its own risk assessment.
    citations: ["Art 7(1)", "Guidance pts 140-141, Example 58", "Commission FAQ s.3", "06-classification.md"]
    borderline: {level: medium, note: "Most consequential default call in the portfolio by revenue. Holds only while marketing and technical documentation describe a phone, not an OS product (guidance pts 142-143).", alternative: "None if documentation is consistent"}

  - id: F02
    name: Arc tablets
    line: Arc devices
    org: devices
    core_functionality: "General-purpose tablet computer for media, apps and productivity"
    ancillary: ["Halo OS (integrated)", "Lumen Browser", "Bastion secure element"]
    placement: placed
    category: default
    foss_qualifying: false
    monetisation: "Device sale"
    eu_revenue: {est_eur_m: 1300, basis: "device sales"}
    release: {cadence: "Monthly security patches; one new model a year", versions_per_year: 13, initial_types: 3, new_types_per_year: 1, substantial_mods_per_year: 0.5, complexity: 1.3}
    rdps: ["Account sign-in", "Update distribution", "Backup and sync"]
    separately_sold_modules: []
    integrated_components: ["Halo OS", "Bastion secure element"]
    rationale: "Same reasoning as Arc phones: integration of an OS and a secure element does not make the host an OS or a critical product."
    citations: ["Art 7(1)", "Guidance Example 58", "Commission FAQ s.3"]
    borderline: {level: low, note: "As F01.", alternative: "None"}

  - id: F03
    name: Arc earbuds
    line: Arc devices
    org: devices
    core_functionality: "Wireless audio playback and voice calls over Bluetooth"
    ancillary: ["Voice-assistant pass-through to the paired phone", "Firmware updates via phone app"]
    placement: placed
    category: default
    foss_qualifying: false
    monetisation: "Device sale"
    eu_revenue: {est_eur_m: 650, basis: "device sales"}
    release: {cadence: "Firmware every 2-3 months; one new model a year", versions_per_year: 5, initial_types: 3, new_types_per_year: 1, substantial_mods_per_year: 0.2, complexity: 0.7}
    rdps: ["Firmware update service via the companion app"]
    separately_sold_modules: []
    integrated_components: ["Bluetooth radio (network interface type function)"]
    rationale: >-
      An audio accessory. The Bluetooth radio is a network-interface component but not the core functionality (Art 7(1)).
      Assistant access is relayed to the phone; the earbuds do not process natural-language requests or control home devices,
      so Annex III I.16 does not fit. Not a health wearable unless heart-rate or similar features are added (then re-test I.19).
    citations: ["Art 7(1)", "IR 2025/2392 Annex I items 10, 16, 19", "06-classification.md"]
    borderline: {level: low, note: "Becomes I.19 if a health-monitoring feature (for example heart rate) is added to a future model.", alternative: "Annex III Class I item 19"}

  - id: F04
    name: Arc Book laptops
    line: Arc devices
    org: devices
    core_functionality: "General-purpose laptop computer"
    ancillary: ["Lumen OS pre-installed", "Lumen Browser", "Bastion secure element", "UEFI boot firmware"]
    placement: placed
    category: default
    foss_qualifying: false
    monetisation: "Device sale"
    eu_revenue: {est_eur_m: 1500, basis: "device sales"}
    release: {cadence: "Lumen OS updates every 4 weeks; one or two new models a year", versions_per_year: 13, initial_types: 4, new_types_per_year: 1.5, substantial_mods_per_year: 0.5, complexity: 1.3}
    rdps: ["Account sign-in", "Update distribution", "Device management enrolment"]
    separately_sold_modules: []
    integrated_components: ["Lumen OS (I.11 type function)", "Bastion secure element", "Boot firmware (I.8 type function)"]
    rationale: >-
      The PC maker is manufacturer of the whole and a pre-installed OS does not make the laptop an OS (guidance para 25, Example 8);
      the FAQ says a laptop with a secure element is not a critical product. Lumen OS supplied separately is its own product (F14).
    citations: ["Guidance para 25, Example 8", "Commission FAQ s.3", "Art 7(1)", "03-scope.md hard cases"]
    borderline: {level: low, note: "Default only for the laptop; the separately supplied Lumen OS images are Class I (F14).", alternative: "None"}

  # ---------------- Halo platform ----------------
  - id: F05
    name: Halo OS as integrated in Arc phones and tablets
    line: Halo
    org: platforms
    core_functionality: "Mobile operating system: abstracts hardware and manages execution"
    ancillary: []
    placement: integrated_only
    host: "F01, F02"
    category: I11
    foss_qualifying: false
    monetisation: "Not supplied separately by Aldermoor on Arc devices; updates are not a new placing unless substantial"
    eu_revenue: {est_eur_m: 0, basis: "counted in F01 and F02"}
    release: {cadence: "Monthly security patches; one major release a year", versions_per_year: 13, initial_types: 0, new_types_per_year: 0, substantial_mods_per_year: 0, complexity: 4}
    rdps: []
    separately_sold_modules: []
    integrated_components: []
    rationale: >-
      Not a separate product on Arc devices; it is assessed inside the phone and tablet risk assessments. If Aldermoor ever
      offered Halo OS as a separate download or licence for third-party hardware, that offering would be an Annex III I.11 product.
      Each annual major release still needs the four-question substantial-modification test for the host devices (guidance pt 110).
    citations: ["Art 7(1)", "Guidance Example 58", "Guidance pts 108-112"]
    borderline: {level: medium, note: "Status depends on supply model, not code. Compare F06 and F07.", alternative: "Annex III Class I item 11 if supplied separately"}

  - id: F06
    name: Halo Services package (licensed to third-party OEMs)
    line: Halo
    org: platforms
    core_functionality: "Proprietary application and services framework: app store client, account services, push, location and payment APIs"
    ancillary: ["Account sign-in for Aldermoor services", "Device-integrity attestation API"]
    placement: placed
    category: default
    foss_qualifying: false
    monetisation: "Licensed to OEMs free of fee under a distribution agreement; monetised through app-store commission and services revenue"
    eu_revenue: {est_eur_m: 6800, basis: "enabled: services revenue on third-party Halo devices"}
    release: {cadence: "Weekly app-store updates of framework modules", versions_per_year: 52, initial_types: 1, new_types_per_year: 0, substantial_mods_per_year: 2, complexity: 2}
    rdps: ["App store backend", "Account and identity service", "Push messaging", "Integrity attestation service"]
    separately_sold_modules: ["Halo Services is itself a separately licensed module of the Halo platform (guidance pt 145, Example 61)"]
    integrated_components: []
    rationale: >-
      Separately licensed, so classified on its own core functionality (guidance pt 145, Example 61). That core is app
      distribution and service APIs. It does not abstract hardware or manage execution (not I.11), and account sign-in is
      ancillary to the framework rather than its core (not I.1). The OEM that builds the device OS from HOSP is the manufacturer
      of its own device (Art 3(13)); Aldermoor is the manufacturer of this package as a component placed on the market (Art 3(1)).
    citations: ["Guidance pt 145, Example 61", "Art 3(1)", "Art 3(13)", "Guidance pts 139, 144"]
    borderline: {level: high, note: "If Aldermoor delivered OEMs a complete prebuilt OS image instead of a package on top of the OEM's own HOSP build, Aldermoor would place an OS on the market (I.11). Keep the supply model and contracts consistent with the technical reality (guidance pt 143).", alternative: "Annex III Class I item 11"}

  - id: F07
    name: Halo Wear OS images for third-party watchmakers
    line: Halo
    org: platforms
    core_functionality: "Complete wearable operating system image supplied to OEMs for installation on their watches"
    ancillary: ["Health-data APIs", "Halo Services for wearables"]
    placement: placed
    category: I11
    foss_qualifying: false
    monetisation: "Per-device licence fee"
    eu_revenue: {est_eur_m: 150, basis: "licence fees"}
    release: {cadence: "Monthly security patches; one major release a year", versions_per_year: 13, initial_types: 1, new_types_per_year: 0, substantial_mods_per_year: 1, complexity: 3}
    rdps: ["Update distribution", "Account service"]
    separately_sold_modules: []
    integrated_components: []
    rationale: >-
      A complete OS supplied separately to other manufacturers is a component placed on the market (Art 3(1)) whose core
      functionality matches the I.11 description: software that abstracts hardware and manages execution (IR 2025/2392).
      Same code family as F05, different supply model, different class.
    citations: ["Art 3(1)", "IR 2025/2392 Annex I item 11", "06-classification.md Table A"]
    borderline: {level: low, note: "Clear once supplied as a complete image.", alternative: "None"}

  # ---------------- Consumer apps ----------------
  - id: F08
    name: Consumer mobile and desktop apps (mail, maps, photos, video, music)
    line: Consumer apps
    org: cloud_apps
    core_functionality: "Communication, navigation and media applications"
    ancillary: ["In-app web views (embedded browser component)", "Account sign-in"]
    placement: placed
    category: default
    foss_qualifying: false
    monetisation: "Free, monetised through advertising and subscriptions"
    eu_revenue: {est_eur_m: 2500, basis: "enabled: advertising and subscription revenue attributed to the apps"}
    release: {cadence: "Weekly app releases", versions_per_year: 52, initial_types: 12, new_types_per_year: 1, substantial_mods_per_year: 3, complexity: 1}
    rdps: ["Each app's own backend APIs (mail, maps tiles, photo sync)"]
    separately_sold_modules: []
    integrated_components: ["Lumen WebView or platform webview"]
    rationale: >-
      Free apps monetised by advertising are supplied in a commercial activity (Art 3(22); recital 15; guidance Examples 14-16).
      An app with an embedded browser is not a browser (IR 2025/2392 recitals; FAQ news-app example), so the class is default.
    citations: ["Art 3(22)", "Recital 15", "Guidance Examples 14-16", "IR 2025/2392 recitals", "Commission FAQ s.3"]
    borderline: {level: low, note: "Re-test any app whose core becomes a category function (for example a password-manager app).", alternative: "None"}

  - id: F09
    name: Aldermoor Authenticator (OTP and MFA app)
    line: Consumer apps
    org: cloud_apps
    core_functionality: "Generates one-time passwords and approves multi-factor sign-in prompts"
    ancillary: ["Encrypted backup of OTP seeds to the user's account"]
    placement: placed
    category: I1
    foss_qualifying: false
    monetisation: "Free; part of the Aldermoor account ecosystem"
    eu_revenue: {est_eur_m: 0, basis: "not attributable"}
