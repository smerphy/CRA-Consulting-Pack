    foss_qualifying: false
    monetisation: "Device sale"
    eu_revenue: {est_eur_m: 620, basis: "device sales"}
    release: {cadence: "Firmware every 4 weeks; assistant model updates server-side; two or three new models a year", versions_per_year: 13, initial_types: 7, new_types_per_year: 3, substantial_mods_per_year: 1, complexity: 1.3}
    rdps: ["Assistant speech and language backend", "Home-graph and device-control service"]
    separately_sold_modules: []
