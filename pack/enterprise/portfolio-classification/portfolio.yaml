    release: {cadence: "Firmware updated with host security patches", versions_per_year: 4, initial_types: 0, new_types_per_year: 0, substantial_mods_per_year: 0, complexity: 2}
    rdps: []
    separately_sold_modules: []
    integrated_components: []
    rationale: >-
      Not placed on the market separately, so it has no class of its own and does not make the host critical (Art 7(1); the
