  - id: F18
    name: Hearth smart speakers and displays with assistant
    line: Hearth
    org: devices
    core_functionality: "Voice assistant that processes natural-language requests and controls connected home devices"
    ancillary: ["Music playback", "Thread border router", "Display and camera on display models"]
    placement: placed
