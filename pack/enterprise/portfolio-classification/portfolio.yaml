  # ---------------- Security hardware ----------------
  - id: F25
    name: Keystone security keys (FIDO)
    line: Keystone and Bastion
    org: devices
    core_functionality: "Hardware authenticator for FIDO2 and passkey sign-in"
    ancillary: ["OTP", "Smart-card (PIV) interface on some models"]
    placement: placed
    category: I1
    foss_qualifying: false
    monetisation: "Device sale (sold separately)"
    eu_revenue: {est_eur_m: 45, basis: "device sales"}
    release: {cadence: "Firmware is not field-updatable; one new model every one to two years", versions_per_year: 1, initial_types: 4, new_types_per_year: 0.7, substantial_mods_per_year: 0, complexity: 1}
    rdps: []
    separately_sold_modules: []
    integrated_components: ["Secure element chip (bought in)"]
    rationale: >-
      Authentication hardware falls within I.1 (systems providing authentication; MFA). The key carries a secure element.
      If that element is designed to AVA_VAN.4 or higher, the key could be read as a "secure element in other carrier form"
      under Annex IV item 3 (IR 2025/2392 Annex II), which would make it critical.
    citations: ["IR 2025/2392 Annex I item 1", "IR 2025/2392 Annex II item 3", "06-classification.md (AVA_VAN discriminator)"]
    borderline: {level: high, note: "I.1 versus Annex IV item 3 turns on the chip's AVA_VAN target and on whether a USB key is a smartcard 'carrier'. Route is the same today (B+C or H); it diverges if an Art 8(1) act makes certification mandatory for Annex IV.", alternative: "Annex IV item 3 (critical)"}

