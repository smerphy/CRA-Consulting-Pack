    citations: ["Art 7(1)", "Commission FAQ s.3", "IR 2025/2392 Annex II item 3", "06-classification.md"]
    borderline: {level: medium, note: "Any external sale (for example to a partner phone maker) creates a critical product overnight. Gate it through the classification register.", alternative: "Annex IV item 3 if sold separately"}

